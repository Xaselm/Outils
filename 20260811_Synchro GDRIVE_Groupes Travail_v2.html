<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des groupes de travail</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --card-bg:#ffffff;
    --ink:#1f2937;
    --ink-soft:#6b7280;
    --ink-faint:#9ca3af;
    --line:#e5e7eb;
    --line-soft:#eef0f3;

    --teal:#0d9488; --teal-bg:#ccfbf1; --teal-text:#0f766e;
    --amber:#d97706; --amber-bg:#fef3c7; --amber-text:#b45309;
    --purple:#7c3aed; --purple-bg:#ede9fe; --purple-text:#6d28d9;
    --red:#dc2626; --red-bg:#fee2e2; --red-text:#b91c1c;

    --primary:#134e4a;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 2px 8px -2px rgba(16,24,40,0.08);
    --shadow-hover: 0 4px 12px -2px rgba(16,24,40,0.12), 0 2px 4px rgba(16,24,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:32px 28px 80px;
  }
  .wrap{max-width:1240px;margin:0 auto;}

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .subtitle{
    font-size:14px;
    color:var(--ink-soft);
    margin-top:5px;
  }
  button{font-family:inherit; cursor:pointer;}
  .btn-primary{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    box-shadow:var(--shadow);
    transition:transform .12s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn-primary:hover{background:#0d3733; transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .header-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn-secondary{
    background:var(--card-bg);
    color:var(--ink);
    border:1px solid var(--line);
    padding:11px 16px;
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    white-space:nowrap;
  }
  .btn-secondary:hover{background:var(--line-soft);}
  .drive-btn{display:inline-flex; align-items:center; gap:7px;}
  .drive-dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:var(--ink-faint); transition:background .2s ease;
  }
  .drive-dot.is-connected{background:var(--teal);}
  .drive-dot.is-syncing{background:var(--amber); animation:drive-pulse 1s ease-in-out infinite;}
  .drive-dot.is-error{background:var(--red);}
  @keyframes drive-pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  /* stat row */
  .stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .stat-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-top:3px solid var(--stat-color, var(--ink-faint));
    border-radius:10px;
    padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat-box .stat-num{font-size:26px; font-weight:700; color:var(--ink); line-height:1;}
  .stat-box .stat-label{font-size:13px; color:var(--ink-soft); margin-top:4px;}

  /* empty state */
  .empty{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:56px 20px;
    text-align:center;
    color:var(--ink-soft);
    background:var(--card-bg);
    grid-column:1 / -1;
  }
  .empty p{font-family:'Zilla Slab', serif; font-size:18px; margin:0 0 6px; color:var(--ink); font-weight:700;}
  .empty span{font-size:13px;}

  /* kanban columns */
  .board{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
    align-items:start;
  }
  .column{
    background:rgba(255,255,255,0.4);
    border-radius:12px;
    padding:14px;
    min-height:60px;
  }
  .column-head{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:14px;
    padding:0 2px;
  }
  .column-icon{
    width:26px; height:26px;
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    flex-shrink:0;
  }
  .column-title{font-size:15px; font-weight:700; color:var(--ink); flex:1;}
  .column-count{
    background:var(--line);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    min-width:22px;
    height:22px;
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px;
  }
  .column-cards{display:flex; flex-direction:column; gap:12px;}
  .column-empty{
    font-size:12.5px;
    color:var(--ink-faint);
    font-style:italic;
    padding:10px 4px;
  }

  /* dossier card */
  .dossier{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-left:4px solid var(--card-color, var(--ink-faint));
    border-radius:9px;
    padding:14px 14px 12px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .dossier:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover);}

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    line-height:1.35;
    margin:0;
  }
  .card-icons{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{
    background:none; border:none;
    color:var(--ink-faint);
    font-size:13px;
    padding:3px 5px;
    border-radius:5px;
    line-height:1;
  }
  .icon-btn:hover{background:var(--line-soft); color:var(--ink);}
  .icon-btn.danger:hover{color:var(--red); background:var(--red-bg);}

  .card-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
    line-height:1.4;
  }
  .card-resp{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:9px 0 0;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .card-resp b{color:var(--ink); font-weight:600;}

  .avatars{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}
  .avatar{
    width:24px; height:24px;
    border-radius:50%;
    color:#fff;
    font-size:10px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .avatar.more{
    background:var(--line);
    color:var(--ink-soft);
    font-size:9.5px;
  }

  .mini-progress{margin:10px 0 0; padding:0; list-style:none;}
  .mini-progress li{
    font-size:11.5px;
    line-height:1.4;
    padding:3px 0 3px 10px;
    border-left:2px solid var(--line);
    color:var(--ink-soft);
    margin-bottom:1px;
  }
  .mini-progress .mp-date{font-weight:700; color:var(--ink); margin-right:4px;}
  .no-mini{font-size:11.5px; color:var(--ink-faint); font-style:italic; margin-top:8px;}

  .card-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .status-pill-select{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    border-radius:14px;
    padding:5px 24px 5px 10px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    background-repeat:no-repeat;
    background-position:right 8px center;
    background-size:9px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%236b7280'/></svg>");
  }
  .status-pill-select.s-non_commence{background-color:var(--teal-bg); color:var(--teal-text);}
  .status-pill-select.s-en_cours{background-color:var(--amber-bg); color:var(--amber-text);}
  .status-pill-select.s-standby{background-color:var(--purple-bg); color:var(--purple-text);}
  .status-pill-select.s-cloture{background-color:var(--red-bg); color:var(--red-text);}

  .update-pill{
    font-size:11px;
    color:var(--ink-soft);
    background:var(--line-soft);
    padding:5px 9px;
    border-radius:14px;
    white-space:nowrap;
  }

  /* archive bar */
  .archive-section{margin-top:22px;}
  .archive-toggle{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 18px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .archive-toggle:hover{box-shadow:var(--shadow-hover);}
  .archive-toggle .chevron{
    margin-left:auto;
    display:inline-block;
    transition:transform .15s ease;
    color:var(--ink-soft);
    font-size:12px;
  }
  .archive-toggle.expanded .chevron{transform:rotate(180deg);}
  .archive-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:14px;
    margin-top:14px;
  }
  .archive-grid .dossier{opacity:0.85;}

  /* overlay / modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(17,24,39,0.5);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg);
    border-radius:14px;
    max-width:600px;
    width:100%;
    padding:26px 26px 24px;
    box-shadow:0 24px 60px -12px rgba(17,24,39,0.35);
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:14px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{
    font-family:'Zilla Slab', serif;
    font-size:21px;
    margin:0;
    color:var(--ink);
  }
  .eyebrow{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .close-x{
    background:none; border:none;
    font-size:20px;
    color:var(--ink-faint);
    line-height:1;
    padding:2px 6px;
    border-radius:6px;
  }
  .close-x:hover{color:var(--ink); background:var(--line-soft);}

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    margin-top:15px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=date], select, textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
    border-color:transparent;
  }
  textarea{resize:vertical; min-height:70px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .participant-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .rm-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--red);
    width:34px; height:34px;
    border-radius:7px;
    font-size:15px;
  }
  .rm-btn:hover{background:var(--red); color:#fff; border-color:var(--red);}
  .add-participant{
    margin-top:4px;
    background:none;
    border:1px dashed var(--line);
    color:var(--ink-soft);
    padding:8px 14px;
    font-size:12.5px;
    font-weight:600;
    border-radius:7px;
    width:100%;
  }
  .add-participant:hover{border-color:var(--teal); color:var(--teal-text);}

  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px;
    margin-top:22px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px 16px;
    font-size:12.5px;
    font-weight:600;
    border-radius:7px;
  }
  .btn-ghost:hover{border-color:var(--red); color:var(--red);}

  /* detail modal specifics */
  .detail-section-title{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin:20px 0 9px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .detail-section-title:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .people-list{display:flex; flex-wrap:wrap; gap:8px;}
  .person-chip{
    background:var(--line-soft);
    border-radius:7px;
    padding:6px 10px;
    font-size:12.5px;
  }
  .person-chip b{font-weight:600; color:var(--ink);}
  .person-chip span{color:var(--ink-soft); font-size:11px; display:block; margin-top:1px;}

  .timeline{list-style:none; margin:0; padding:0;}
  .timeline li{
    position:relative;
    padding:2px 0 16px 20px;
    border-left:2px solid var(--line);
    margin-left:4px;
  }
  .timeline li:last-child{border-color:transparent; padding-bottom:0;}
  .timeline li::before{
    content:"";
    position:absolute;
    left:-6px; top:2px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--teal);
    border:2px solid #fff;
  }
  .timeline-date{font-size:11.5px; color:var(--teal-text); font-weight:700;}
  .timeline-text{font-size:13.5px; margin-top:2px; line-height:1.5; color:var(--ink);}
  .no-progress{color:var(--ink-soft); font-size:13px; font-style:italic;}

  .add-progress{
    display:grid;
    grid-template-columns:145px 1fr auto;
    gap:10px;
    align-items:end;
    margin-top:12px;
  }
  .add-progress button{
    background:var(--teal);
    color:#fff; border:none;
    padding:9px 16px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
    height:40px;
  }
  .add-progress button:hover{background:var(--teal-text);}

  .status-banner{
    padding:10px 14px;
    font-size:12.5px;
    font-weight:600;
    border-radius:8px;
    margin-bottom:6px;
  }
  .status-banner.s-cloture{background:var(--red-bg); color:var(--red-text);}
  .status-banner.s-standby{background:var(--purple-bg); color:var(--purple-text);}
  .status-banner.s-non_commence{background:var(--teal-bg); color:var(--teal-text);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:8px;
    font-size:12.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:100;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1;}

  @media (max-width:900px){
    .board{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .row2{grid-template-columns:1fr;}
    .participant-row{grid-template-columns:1fr 1fr; }
    .participant-row .rm-btn{grid-column:1/3; width:100%;}
    .add-progress{grid-template-columns:1fr;}
    .stats{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Suivi des groupes de travail</h1>
      <p class="subtitle">Vos groupes, responsables et avancements en un coup d'œil</p>
    </div>
    <div class="header-actions">
      <button id="btn-drive-connect" class="btn-secondary drive-btn" title="Connecter Google Drive pour synchroniser vos groupes">
        <span id="drive-dot" class="drive-dot"></span> <span id="drive-status-label">Drive : non connecté</span>
      </button>
      <button id="btn-drive-force" class="btn-secondary" title="Forcer l'envoi vers Drive maintenant">Forcer synchro</button>
      <button id="btnExportJson" class="btn-secondary" title="Exporter les groupes (JSON)">Exporter (JSON)</button>
      <button id="btnImportJson" class="btn-secondary" title="Importer des groupes (JSON)">Importer (JSON)</button>
      <input type="file" id="importJsonInput" accept="application/json" style="display:none;">
      <button class="btn-primary" onclick="openCreateModal()">+ Nouveau groupe</button>
    </div>
  </header>

  <div class="project-filter-bar" style="display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;">
    <label for="projectFilter" style="font-size:13px; font-weight:600; color:var(--ink-soft);">Projet</label>
    <select id="projectFilter" style="border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; background:#fff; color:var(--ink); font-family:inherit;">
      <option value="">Tous les projets</option>
    </select>
    <datalist id="projectDatalist"></datalist>
  </div>

  <div class="stats" id="statsRow"></div>

  <div id="emptyState" class="empty" style="display:none;">
    <p>Aucun groupe de travail pour l'instant</p>
    <span>Cliquez sur « + Nouveau groupe » pour ouvrir votre premier dossier.</span>
  </div>

  <div class="board" id="board"></div>

  <div class="archive-section" id="archiveSection" style="display:none;">
    <button class="archive-toggle" id="archiveToggle" onclick="toggleArchived()"></button>
    <div id="archiveGrid" class="archive-grid" style="display:none;"></div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="overlay" id="createOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Nouveau groupe de travail</h2>
      <button class="close-x" onclick="closeCreateModal()">&times;</button>
    </div>
    <form id="createForm" onsubmit="return submitCreate(event)">
      <label>Titre du groupe de travail</label>
      <input type="text" id="f-titre" required placeholder="Ex. Refonte du processus d'accueil">

      <label>Projet (optionnel)</label>
      <input type="text" id="f-projet" list="projectDatalist" placeholder="Non classé">

      <label>Statut initial</label>
      <select id="f-statut"></select>

      <div class="row2">
        <div>
          <label>Responsable — nom</label>
          <input type="text" id="f-resp-nom" required placeholder="Nom du responsable">
        </div>
        <div>
          <label>Responsable — service</label>
          <input type="text" id="f-resp-service" required placeholder="Ex. Ressources humaines">
        </div>
      </div>

      <label>Participants</label>
      <div id="participantsWrap"></div>
      <button type="button" class="add-participant" onclick="addParticipantRow()">+ Ajouter un participant</button>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="closeCreateModal()">Annuler</button>
        <button type="submit" class="btn-primary">Créer le dossier</button>
      </div>
    </form>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   Module de synchronisation Google Drive
   Même patron que sur le Semainier : l'app stocke tout son état sous
   UNE seule clé localStorage ('dossiers'). Ce module se branche en
   périphérie via window.__driveTouch(), appelé depuis saveDossiers().
   showToast() est déjà globale ici (pas d'IIFE dans le script
   principal), donc directement appelable sans exposition supplémentaire.
   =================================================================== */
(function () {
  'use strict';

  var DRIVE_CLIENT_ID = '1032081391210-5515mnbact7e9t77fssh753330hs5ago.apps.googleusercontent.com';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var APP_NS = 'groupestravail';
  var DATA_KEY = 'data';
  var APP_STORAGE_KEY = 'dossiers'; /* doit rester identique à la clé utilisée par saveDossiers()/loadDossiers() */
  var LS_PREFIX = 'gdsync__' + APP_NS + '__';
  var MODIFIED_KEY = LS_PREFIX + 'modified';
  var CONNECTED_FLAG = LS_PREFIX + 'connected';
  var SILENT_REFRESH_MS = 45 * 60 * 1000;
  var PUSH_DEBOUNCE_MS = 1200;

  var tokenClient = null;
  var accessToken = null;
  var tokenExpiresAt = 0;
  var pushTimer = null;

  function toast(msg, type) {
    if (typeof window.showToast === 'function') window.showToast(msg, type);
  }

  /* ---------- Cache local = la clé localStorage réelle de l'app,
     avec un horodatage "modified" tenu à part ---------- */
  function localGet() {
    try {
      var raw = localStorage.getItem(APP_STORAGE_KEY);
      if (!raw) return null;
      var modified = parseInt(localStorage.getItem(MODIFIED_KEY), 10) || 0;
      return { value: raw, modified: modified };
    } catch (e) { return null; }
  }
  function localSet(value, modifiedOverride) {
    try {
      var modified = modifiedOverride;
      if (!modified) {
        var existing = localGet();
        modified = (existing && existing.value === value) ? existing.modified : Date.now();
      }
      localStorage.setItem(APP_STORAGE_KEY, value);
      localStorage.setItem(MODIFIED_KEY, String(modified));
      return true;
    } catch (e) { return false; }
  }

  /* ---------- Statut visuel ---------- */
  function setSyncStatus(mode) {
    var dot = document.getElementById('drive-dot');
    var label = document.getElementById('drive-status-label');
    if (!dot || !label) return;
    dot.className = 'drive-dot' + (mode === 'connected' || mode === 'ok' ? ' is-connected' : mode === 'sync' ? ' is-syncing' : mode === 'error' ? ' is-error' : '');
    var texts = {
      idle: 'Drive : non connecté',
      connected: 'Drive : connecté',
      ok: 'Drive : synchronisé',
      sync: 'Drive : synchro…',
      error: 'Drive : erreur de synchro'
    };
    label.textContent = texts[mode] || texts.idle;
  }

  /* ---------- Appels API Drive ---------- */
  function hasValidToken() { return !!accessToken && Date.now() < tokenExpiresAt - 5000; }

  function driveFetch(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + accessToken;
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error('Drive API ' + res.status);
      return res;
    });
  }

  function driveFileName(key) { return 'storage__' + APP_NS + '__' + key + '.json'; }

  function driveFindFile(key) {
    var q = encodeURIComponent("name='" + driveFileName(key) + "' and trashed=false");
    var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)';
    return driveFetch(url).then(function (res) { return res.json(); }).then(function (data) {
      return (data.files && data.files[0]) || null;
    });
  }

  function driveGetRecord(fileId) {
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')
      .then(function (res) { return res.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return null; } });
  }

  function driveCreateFile(key, record) {
    var boundary = 'gdsyncbound';
    var metadata = { name: driveFileName(key), parents: ['appDataFolder'] };
    var body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(record) + '\r\n' +
      '--' + boundary + '--';
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: body
    });
  }

  function driveUpdateFile(fileId, record) {
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    });
  }

  function drivePushRecord(key, record) {
    return driveFindFile(key).then(function (existing) {
      return existing ? driveUpdateFile(existing.id, record) : driveCreateFile(key, record);
    });
  }

  /* ---------- Synchro bidirectionnelle (dernier modifié gagne) ---------- */
  function syncData(firstConnect) {
    setSyncStatus('sync');
    var local = localGet();
    return driveFindFile(DATA_KEY).then(function (existing) {
      if (!existing) {
        if (local) return drivePushRecord(DATA_KEY, local).then(function () { setSyncStatus('ok'); });
        setSyncStatus('ok');
        return;
      }
      return driveGetRecord(existing.id).then(function (remote) {
        if (!remote) { setSyncStatus('ok'); return; }
        if (firstConnect || !local || remote.modified > local.modified) {
          /* Première connexion sur ce navigateur (le cloud fait toujours foi), ou
             donnée distante plus récente : on adopte la version Drive. */
          var changed = !(local && local.value === remote.value);
          localSet(remote.value, remote.modified);
          setSyncStatus('ok');
          if (changed) {
            setSyncStatus('sync');
            toast('Groupes à jour reçus de Drive, actualisation…', 'info');
            setTimeout(function () { location.reload(); }, 900);
          }
        } else if (local.modified > remote.modified) {
          return driveUpdateFile(existing.id, local).then(function () { setSyncStatus('ok'); });
        } else {
          setSyncStatus('ok');
        }
      });
    }).catch(function (e) {
      setSyncStatus('error');
      console.error('[DriveSync] Échec de la synchronisation :', e);
    });
  }

  /* ---------- Sauvegarde différée déclenchée par saveDossiers() ---------- */
  function scheduleDrivePush() {
    if (!hasValidToken()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      var local = localGet();
      if (!local) return;
      setSyncStatus('sync');
      drivePushRecord(DATA_KEY, local).then(function () {
        setSyncStatus('ok');
      }).catch(function (e) {
        setSyncStatus('error');
        console.error('[DriveSync] Échec de la sauvegarde vers Drive :', e);
      });
    }, PUSH_DEBOUNCE_MS);
  }
  window.__driveTouch = function () {
    try {
      localStorage.setItem(MODIFIED_KEY, String(Date.now()));
    } catch (e) {}
    scheduleDrivePush();
  };

  /* ---------- Auth Google ---------- */
  function onTokenReceived(resp) {
    if (resp.error) { setSyncStatus('error'); return; }
    var isFirstConnect = localStorage.getItem(CONNECTED_FLAG) !== '1';
    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in * 1000);
    localStorage.setItem(CONNECTED_FLAG, '1');
    setSyncStatus('connected');
    syncData(isFirstConnect);
  }

  function describeError(e) {
    if (e && e.message) return e.message;
    try { return JSON.stringify(e); } catch (e2) { return String(e); }
  }

  function forceSyncPush() {
    if (!hasValidToken()) {
      alert('Pas encore connecté à Drive (ou session expirée). Clique d\'abord sur "Drive : non connecté", puis réessaie "Forcer synchro".');
      return;
    }
    setSyncStatus('sync');
    var local = localGet();
    if (!local) {
      setSyncStatus('ok');
      alert('Rien à synchroniser : aucune donnée locale.');
      return;
    }
    drivePushRecord(DATA_KEY, local).then(function () {
      setSyncStatus('ok');
      alert('Synchro forcée : OK (' + Math.round(local.value.length / 1024) + ' Ko envoyés).');
    }).catch(function (e) {
      setSyncStatus('error');
      alert('Synchro forcée : ERREUR - ' + describeError(e));
    });
  }

  function initGis() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      setTimeout(initGis, 300);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: onTokenReceived
    });
    document.getElementById('btn-drive-connect').addEventListener('click', function () {
      tokenClient.requestAccessToken({ prompt: hasValidToken() ? '' : 'consent' });
    });
    document.getElementById('btn-drive-force').addEventListener('click', forceSyncPush);
    if (localStorage.getItem(CONNECTED_FLAG) === '1') {
      tokenClient.requestAccessToken({ prompt: '' });
    }
    setInterval(function () {
      if (localStorage.getItem(CONNECTED_FLAG) === '1') {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }, SILENT_REFRESH_MS);
  }
  initGis();
})();
</script>

<script>
let dossiers = [];
let currentDetailId = null;
let archiveExpanded = false;

/* ---------- statuts possibles ---------- */
const STATUSES = [
  { value:'non_commence', label:'Non commencé', icon:'📌', color:'teal' },
  { value:'en_cours',      label:'En cours',      icon:'🔄', color:'amber' },
  { value:'standby',       label:'Standby',       icon:'⏸️', color:'purple' },
  { value:'cloture',       label:'Clôturé',       icon:'✅', color:'red' }
];
function statusLabel(value){
  const s = STATUSES.find(s => s.value === value);
  return s ? s.label : value;
}
function statusInfo(value){
  return STATUSES.find(s => s.value === value) || STATUSES[0];
}

const AVATAR_COLORS = ['#0d9488','#d97706','#7c3aed','#2563eb','#db2777','#059669','#ca8a04','#4f46e5'];
function avatarColor(index){ return AVATAR_COLORS[index % AVATAR_COLORS.length]; }
function initials(nom){
  if(!nom) return '?';
  const parts = nom.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

/* ---------- stockage : window.storage si dispo (aperçu Claude), sinon localStorage, sinon mémoire ---------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
let hasLocalStorage = false;
try{
  localStorage.setItem('__test__','1');
  localStorage.removeItem('__test__');
  hasLocalStorage = true;
}catch(e){ hasLocalStorage = false; }

async function loadDossiers(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get('dossiers');
      dossiers = res && res.value ? JSON.parse(res.value) : [];
    } else if(hasLocalStorage){
      const raw = localStorage.getItem('dossiers');
      dossiers = raw ? JSON.parse(raw) : [];
    } else {
      dossiers = [];
    }
  }catch(e){
    dossiers = [];
  }
  // migration des dossiers créés avant l'ajout des statuts multiples
  dossiers.forEach(d => {
    if(!d.status){
      d.status = d.closed ? 'cloture' : 'en_cours';
    }
  });
  render();
}

async function saveDossiers(){
  try{
    if(hasClaudeStorage){
      await window.storage.set('dossiers', JSON.stringify(dossiers));
    } else if(hasLocalStorage){
      localStorage.setItem('dossiers', JSON.stringify(dossiers));
      if (typeof window.__driveTouch === 'function') window.__driveTouch();
    }
  }catch(e){
    console.error('Erreur de stockage :', e);
    showToast("Enregistrement impossible (mémoire uniquement)");
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ---------- construit une carte dossier (DOM) ---------- */
function buildCard(d){
  const info = statusInfo(d.status);
  const card = document.createElement('div');
  card.className = 'dossier';
  card.style.setProperty('--card-color', `var(--${info.color})`);
  card.onclick = () => openDetail(d.id);

  const maxPeople = 10;
  const shownPeople = d.participants.slice(0, maxPeople);
  const avatarsHtml = d.participants.length
    ? `<div class="avatars">
        ${shownPeople.map((p,i) => `<div class="avatar" style="background:${avatarColor(i)}" title="${escapeHtml(p.nom)} · ${escapeHtml(p.service)}">${initials(p.nom)}</div>`).join('')}
        ${d.participants.length > maxPeople ? `<div class="avatar more">+${d.participants.length - maxPeople}</div>` : ''}
      </div>`
    : '';

  const recentProgress = [...d.progress].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 3);
  const progressHtml = recentProgress.length
    ? `<ul class="mini-progress">
        ${recentProgress.map(p => `<li><span class="mp-date">${formatDate(p.date)}</span>${escapeHtml(p.texte)}</li>`).join('')}
      </ul>`
    : `<p class="no-mini">Aucun avancement enregistré</p>`;

  const lastUpdate = d.progress.length ? `Maj ${formatDate(d.progress[d.progress.length-1].date)}` : `Créé le ${formatDate(d.createdAt)}`;

  card.innerHTML = `
    <div class="card-top">
      <p class="card-title">${escapeHtml(d.titre)}</p>
      <div class="card-icons">
        <button class="icon-btn" title="Ouvrir" onclick="event.stopPropagation(); openDetail('${d.id}')">✏️</button>
        <button class="icon-btn danger" title="Supprimer" onclick="event.stopPropagation(); quickDelete('${d.id}')">🗑️</button>
      </div>
    </div>
    <div class="card-resp">👤 <b>${escapeHtml(d.respNom)}</b> · ${escapeHtml(d.respService)}</div>
    ${avatarsHtml}
    ${progressHtml}
    <div class="card-footer">
      <select class="status-pill-select s-${d.status}" onclick="event.stopPropagation()" onchange="event.stopPropagation(); changeStatusForId('${d.id}', this.value)">
        ${STATUSES.map(s => `<option value="${s.value}" ${s.value === d.status ? 'selected' : ''}>${s.label}</option>`).join('')}
      </select>
      <span class="update-pill">${lastUpdate}</span>
    </div>
  `;
  return card;
}

/* ---------- render ---------- */
function listKnownProjects(){
  const set = new Set();
  dossiers.forEach(d => { if(d.projet) set.add(d.projet); });
  return [...set].sort((a,b) => a.localeCompare(b));
}
function refreshProjectFilterOptions(){
  const sel = document.getElementById('projectFilter');
  const current = sel.value;
  const projects = listKnownProjects();
  sel.innerHTML = '<option value="">Tous les projets</option>' +
    projects.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  sel.value = projects.includes(current) ? current : '';
  document.getElementById('projectDatalist').innerHTML =
    projects.map(p => `<option value="${escapeHtml(p)}">`).join('');
}
document.getElementById('projectFilter').addEventListener('change', render);

function render(){
  refreshProjectFilterOptions();
  const filterVal = document.getElementById('projectFilter').value;
  const visibleDossiers = filterVal ? dossiers.filter(d => d.projet === filterVal) : dossiers;

  const board = document.getElementById('board');
  const empty = document.getElementById('emptyState');
  const statsRow = document.getElementById('statsRow');
  const archiveSection = document.getElementById('archiveSection');
  const archiveToggle = document.getElementById('archiveToggle');
  const archiveGrid = document.getElementById('archiveGrid');

  board.innerHTML = '';
  archiveGrid.innerHTML = '';
  statsRow.innerHTML = '';

  const counts = { non_commence:0, en_cours:0, standby:0, cloture:0 };
  visibleDossiers.forEach(d => { if(counts[d.status] !== undefined) counts[d.status]++; });

  STATUSES.forEach(s => {
    const box = document.createElement('div');
    box.className = 'stat-box';
    box.style.setProperty('--stat-color', `var(--${s.color})`);
    box.innerHTML = `<div class="stat-num">${counts[s.value]}</div><div class="stat-label">${s.label}</div>`;
    statsRow.appendChild(box);
  });

  if(visibleDossiers.length === 0){
    empty.style.display = 'block';
    empty.querySelector('p').textContent = filterVal ? 'Aucun groupe pour ce projet' : 'Aucun groupe de travail pour l\'instant';
    empty.querySelector('span').textContent = filterVal ? 'Choisissez un autre projet ou créez-en un nouveau ici.' : 'Cliquez sur « + Nouveau groupe » pour ouvrir votre premier dossier.';
    board.style.display = 'none';
    archiveSection.style.display = 'none';
    return;
  }
  board.style.display = 'grid';
  empty.style.display = 'none';

  const boardColumns = STATUSES.filter(s => s.value !== 'cloture');
  boardColumns.forEach(col => {
    const items = visibleDossiers.filter(d => d.status === col.value);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = `
      <div class="column-head">
        <div class="column-icon" style="background:var(--${col.color}-bg); color:var(--${col.color}-text, var(--${col.color}));">${col.icon}</div>
        <div class="column-title">${col.label}</div>
        <div class="column-count">${items.length}</div>
      </div>
      <div class="column-cards"></div>
    `;
    const cardsWrap = colEl.querySelector('.column-cards');
    if(items.length === 0){
      cardsWrap.innerHTML = `<div class="column-empty">Aucun groupe</div>`;
    } else {
      items.forEach(d => cardsWrap.appendChild(buildCard(d)));
    }
    board.appendChild(colEl);
  });

  /* section archives : groupes clôturés, repliée par défaut */
  const archived = visibleDossiers.filter(d => d.status === 'cloture');
  if(archived.length > 0){
    archiveSection.style.display = 'block';
    archiveToggle.innerHTML = `✅ Groupes clôturés (${archived.length}) — mis de côté <span class="chevron">▾</span>`;
    archiveToggle.classList.toggle('expanded', archiveExpanded);
    archiveGrid.style.display = archiveExpanded ? 'grid' : 'none';
    const sortedArchived = [...archived].sort((a,b) => (b.closedAt || '').localeCompare(a.closedAt || ''));
    sortedArchived.forEach(d => archiveGrid.appendChild(buildCard(d)));
  } else {
    archiveSection.style.display = 'none';
  }
}

function toggleArchived(){
  archiveExpanded = !archiveExpanded;
  render();
}

/* ---------- statut ---------- */
function changeStatusForId(id, newStatus){
  const d = dossiers.find(x => x.id === id);
  if(!d) return;
  d.status = newStatus;
  d.closedAt = (newStatus === 'cloture') ? todayISO() : null;
  saveDossiers();
  render();
  if(currentDetailId === id) renderDetail();
  showToast('Statut mis à jour : ' + statusLabel(newStatus));
}

/* ---------- create modal ---------- */
function openCreateModal(){
  document.getElementById('createForm').reset();
  document.getElementById('f-projet').value = document.getElementById('projectFilter').value || '';
  document.getElementById('participantsWrap').innerHTML = '';
  addParticipantRow();
  const sel = document.getElementById('f-statut');
  sel.innerHTML = STATUSES.filter(s=>s.value!=='cloture').map(s => `<option value="${s.value}">${s.label}</option>`).join('');
  sel.value = 'non_commence';
  document.getElementById('createOverlay').classList.add('show');
}
function closeCreateModal(){
  document.getElementById('createOverlay').classList.remove('show');
}
function addParticipantRow(){
  const wrap = document.getElementById('participantsWrap');
  const row = document.createElement('div');
  row.className = 'participant-row';
  row.innerHTML = `
    <input type="text" placeholder="Nom du participant" class="p-nom">
    <input type="text" placeholder="Service" class="p-service">
    <button type="button" class="rm-btn" onclick="this.parentElement.remove()">&times;</button>
  `;
  wrap.appendChild(row);
}

function submitCreate(e){
  e.preventDefault();
  const titre = document.getElementById('f-titre').value.trim();
  const projet = document.getElementById('f-projet').value.trim();
  const respNom = document.getElementById('f-resp-nom').value.trim();
  const respService = document.getElementById('f-resp-service').value.trim();
  const participants = [...document.querySelectorAll('.participant-row')].map(row => ({
    nom: row.querySelector('.p-nom').value.trim(),
    service: row.querySelector('.p-service').value.trim()
  })).filter(p => p.nom || p.service);

  if(!titre || !respNom || !respService){
    showToast('Merci de compléter le titre et le responsable');
    return false;
  }

  const newDossier = {
    id: uid(),
    titre, projet, respNom, respService,
    participants,
    createdAt: todayISO(),
    progress: [],
    status: document.getElementById('f-statut').value || 'non_commence',
    closedAt: null
  };
  dossiers.push(newDossier);
  saveDossiers();
  render();
  closeCreateModal();
  showToast('Groupe de travail créé');
  return false;
}

/* ---------- detail modal ---------- */
function openDetail(id){
  currentDetailId = id;
  renderDetail();
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
  currentDetailId = null;
}

function renderDetail(){
  const d = dossiers.find(x => x.id === currentDetailId);
  if(!d) return;
  const content = document.getElementById('detailModalContent');

  const peopleHtml = d.participants.length
    ? `<div class="people-list">${d.participants.map(p => `<div class="person-chip"><b>${escapeHtml(p.nom)}</b><span>${escapeHtml(p.service)}</span></div>`).join('')}</div>`
    : `<p class="no-progress">Aucun participant renseigné.</p>`;

  const progressHtml = d.progress.length
    ? `<ul class="timeline">${[...d.progress].sort((a,b)=>a.date.localeCompare(b.date)).map(p => `
        <li><div class="timeline-date">${formatDate(p.date)}</div><div class="timeline-text">${escapeHtml(p.texte)}</div></li>
      `).join('')}</ul>`
    : `<p class="no-progress">Aucun point d'avancement enregistré pour l'instant.</p>`;

  content.innerHTML = `
    <div class="modal-head">
      <div>
        <p class="eyebrow">${statusLabel(d.status)}</p>
        <h2>${escapeHtml(d.titre)}</h2>
      </div>
      <button class="close-x" onclick="closeDetail()">&times;</button>
    </div>

    ${d.status === 'cloture' ? `<div class="status-banner s-cloture">Clôturé le ${formatDate(d.closedAt)}</div>` : ''}
    ${d.status === 'standby' ? `<div class="status-banner s-standby">Ce groupe est actuellement en standby</div>` : ''}
    ${d.status === 'non_commence' ? `<div class="status-banner s-non_commence">Ce groupe n'a pas encore démarré</div>` : ''}

    <div class="detail-section-title">Projet</div>
    <input type="text" id="detail-projet" list="projectDatalist" value="${escapeHtml(d.projet || '')}" placeholder="Non classé"
      onchange="updateProjetForId('${d.id}', this.value)" style="border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; font-family:inherit; width:100%; box-sizing:border-box;">

    <div class="detail-section-title">Statut</div>
    <select id="detail-statut" onchange="changeStatusForId('${d.id}', this.value)">
      ${STATUSES.map(s => `<option value="${s.value}" ${s.value === d.status ? 'selected' : ''}>${s.label}</option>`).join('')}
    </select>

    <div class="detail-section-title">Responsable</div>
    <div class="person-chip" style="display:inline-block;">
      <b>${escapeHtml(d.respNom)}</b><span>${escapeHtml(d.respService)}</span>
    </div>

    <div class="detail-section-title">Participants</div>
    ${peopleHtml}

    <div class="detail-section-title">Avancement</div>
    ${progressHtml}

    ${d.status !== 'cloture' ? `
      <div class="add-progress">
        <div>
          <label style="margin-top:0;">Date</label>
          <input type="date" id="prog-date" value="${todayISO()}">
        </div>
        <div>
          <label style="margin-top:0;">Point d'étape</label>
          <input type="text" id="prog-texte" placeholder="Ce qui a été fait, décidé, ou reste à faire...">
        </div>
        <button type="button" onclick="addProgress()">Ajouter</button>
      </div>
    ` : ''}

    <div class="modal-actions">
      <button class="btn-ghost" onclick="quickDelete('${d.id}')">Supprimer</button>
    </div>
  `;
}

function updateProjetForId(id, value){
  const d = dossiers.find(x => x.id === id);
  if(!d) return;
  d.projet = value.trim();
  saveDossiers();
  render();
  showToast(d.projet ? 'Classé dans « ' + d.projet + ' »' : 'Groupe non classé');
}

function addProgress(){
  const d = dossiers.find(x => x.id === currentDetailId);
  if(!d) return;
  const date = document.getElementById('prog-date').value || todayISO();
  const texte = document.getElementById('prog-texte').value.trim();
  if(!texte){
    showToast("Merci de décrire l'avancement");
    return;
  }
  d.progress.push({date, texte});
  saveDossiers();
  renderDetail();
  render();
  showToast('Avancement ajouté');
}

function quickDelete(id){
  const d = dossiers.find(x => x.id === id);
  if(!d) return;
  if(!confirm(`Supprimer définitivement le dossier « ${d.titre} » ? Cette action est irréversible.`)) return;
  dossiers = dossiers.filter(x => x.id !== id);
  saveDossiers();
  if(currentDetailId === id) closeDetail();
  render();
  showToast('Dossier supprimé');
}

/* close overlays on backdrop click */
document.getElementById('createOverlay').addEventListener('click', e => {
  if(e.target.id === 'createOverlay') closeCreateModal();
});
document.getElementById('detailOverlay').addEventListener('click', e => {
  if(e.target.id === 'detailOverlay') closeDetail();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeCreateModal(); closeDetail(); }
});

/* ---------- Import / Export JSON ---------- */
function exportDossiersJSON(){
  const payload = { app:'groupes_travail', version:1, exportedAt: new Date().toISOString(), dossiers: dossiers };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datePart = todayISO().replace(/-/g,'');
  a.href = url;
  a.download = datePart + '_GroupesTravail_export.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
document.getElementById('btnExportJson').addEventListener('click', exportDossiersJSON);

document.getElementById('btnImportJson').addEventListener('click', () => {
  document.getElementById('importJsonInput').click();
});
document.getElementById('importJsonInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ showToast('Fichier JSON invalide'); return; }
    if(!data || !Array.isArray(data.dossiers)){
      showToast("Ce fichier ne semble pas être un export valide");
      return;
    }
    if(!confirm('Importer ce fichier remplacera tous les groupes actuels. Continuer ?')) return;
    dossiers = data.dossiers;
    saveDossiers();
    render();
    showToast('Import réussi (' + dossiers.length + ' groupe(s))');
  };
  reader.readAsText(file);
  e.target.value = '';
});

loadDossiers();
</script>
