<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Outils</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg: #1b1d1f;
    --bg-raised: #232629;
    --bg-card: #26292c;
    --line: #383c40;
    --text: #e9e5df;
    --text-dim: #9a9d9f;
    --accent: #e0a52c;
    --accent-dim: #7a5e22;
    --danger: #c1543f;
    --ok: #5c8a5c;
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh;}
  .app{max-width:1180px;margin:0 auto;padding:32px 24px 80px;}

  .head{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--line);
    padding-bottom:20px; margin-bottom:20px;
  }
  .head h1{font-size:26px; margin:0 0 4px; letter-spacing:0.3px; font-weight:700;}
  .head .sub{color:var(--text-dim); font-size:13px; font-family:var(--mono);}
  .head-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  button{
    font-family:var(--sans); font-size:13px; cursor:pointer;
    border-radius:6px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--text);
    padding:9px 14px; transition:border-color .15s, background .15s;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent); color:#1b1d1f; border-color:var(--accent); font-weight:700;}
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:transparent;}
  button.small{padding:5px 9px; font-size:12px;}
  button.icon{padding:5px 8px; font-size:13px; line-height:1;}

  .drive-dot{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--line); margin-right:6px; vertical-align:middle;}
  .drive-dot.is-connected{background:var(--ok);}
  .drive-dot.is-syncing{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
  .drive-dot.is-error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:22px;}
  .toolbar input[type=text]{
    flex:1; min-width:180px; background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:9px 12px; font-size:13px; font-family:var(--sans);
  }
  .toolbar input[type=text]:focus{outline:none; border-color:var(--accent);}

  .empty{border:1px dashed var(--line); border-radius:10px; padding:60px 24px; text-align:center; color:var(--text-dim);}
  .empty .icon{font-size:34px; margin-bottom:12px; opacity:.6;}
  .empty h2{color:var(--text); font-size:17px; margin:0 0 8px;}
  .empty p{max-width:440px; margin:0 auto 20px; font-size:13.5px; line-height:1.6;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
  .card{
    --card-accent: var(--accent);
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding:16px 16px 12px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:8px; transition:border-color .15s; text-align:left;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--card-accent);}
  .card:hover{border-color:#4a4e52;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card-title{font-size:16px; font-weight:700;}
  .card-desc{font-size:12.5px; color:var(--text-dim); line-height:1.5; min-height:18px;}
  .gear-btn{background:none; border:none; padding:2px 4px; font-size:14px; color:var(--text-dim); cursor:pointer;}
  .card-actions{display:flex; gap:6px; margin-top:auto; padding-top:8px;}
  .card-actions button{flex:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; width:100%; max-width:420px; padding:20px;}
  .modal h2{margin:0 0 16px; font-size:16px;}
  .modal label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; display:block; margin:12px 0 5px;}
  .modal input[type=text], .modal textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-size:13px; font-family:var(--sans);
  }
  .modal textarea{resize:vertical; min-height:50px;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .swatch{width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  .swatch.selected{border-color:var(--text);}
  .modal-foot{display:flex; justify-content:space-between; gap:8px; margin-top:20px;}
  .modal-foot .right{display:flex; gap:8px;}

  .hidden{display:none !important;}
  footer{margin-top:40px; color:var(--text-dim); font-size:11.5px; font-family:var(--mono); text-align:center;}
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div>
      <h1>Mes Outils</h1>
      <div class="sub">Accès rapide à tous tes outils, depuis n'importe où</div>
    </div>
    <div class="head-actions">
      <button id="btnDriveConnect" title="Connecter Google Drive">
        <span id="driveDot" class="drive-dot"></span><span id="driveLabel">Drive : non connecté</span>
      </button>
      <button id="btnForceSync" class="small">Forcer synchro</button>
      <button id="btnAdd" class="primary">+ Ajouter un outil</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Rechercher un outil...">
  </div>

  <div id="emptyState" class="empty hidden">
    <div class="icon">&#128203;</div>
    <h2>Aucun outil pour l'instant</h2>
    <p>Ajoute tes outils hébergés (Ludothèque, Semainier, Budget...) pour y accéder en un clic depuis ce Hub, sur n'importe quel appareil.</p>
    <button class="primary" id="btnAddEmpty">+ Ajouter un outil</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Hub · synchronisé via Google Drive</footer>
</div>

<!-- Modale ajout / édition -->
<div class="modal-overlay hidden" id="toolModal">
  <div class="modal">
    <h2 id="modalTitle">Ajouter un outil</h2>
    <label>Nom</label>
    <input type="text" id="fName" placeholder="Ma Ludothèque">
    <label>URL</label>
    <input type="text" id="fUrl" placeholder="https://xaselm.github.io/Outils/Checklist-Jeux.html">
    <label>Description (optionnel)</label>
    <textarea id="fDesc" placeholder="Suivi de mon backlog jeux vidéo"></textarea>
    <label>Couleur</label>
    <div class="swatches" id="swatches"></div>
    <div class="modal-foot">
      <div>
        <button class="ghost" id="btnDelete" style="color:var(--danger); display:none;">Supprimer</button>
      </div>
      <div class="right">
        <button class="ghost" id="btnCancel">Annuler</button>
        <button class="primary" id="btnSave">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   Module de synchronisation Google Drive — identique à celui utilisé
   dans les autres outils. APP_NS isole les données de cet outil.
   =================================================================== */
(function () {
  'use strict';

  var DRIVE_CLIENT_ID = '1032081391210-5515mnbact7e9t77fssh753330hs5ago.apps.googleusercontent.com';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var APP_NS = 'hub';
  var ALL_KEYS = ['tools'];
  var LS_PREFIX = 'gdsync__' + APP_NS + '__';
  var CONNECTED_FLAG = LS_PREFIX + 'connected';
  var SILENT_REFRESH_MS = 45 * 60 * 1000;

  var tokenClient = null;
  var accessToken = null;
  var tokenExpiresAt = 0;

  var DB_NAME = 'gdsync_' + APP_NS;
  var DB_STORE = 'kv';
  var dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'key' });
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e.target.error); };
    });
    return dbPromise;
  }

  function idbGet(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readonly');
        var req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function () {
          resolve(req.result ? { value: req.result.value, modified: req.result.modified } : null);
        };
        req.onerror = function () { reject(req.error); };
      });
    }).catch(function () { return null; });
  }

  function idbSet(key, value, modifiedOverride) {
    return idbGet(key).then(function (existing) {
      var modified = modifiedOverride;
      if (!modified) modified = (existing && existing.value === value) ? existing.modified : Date.now();
      return openDb().then(function (db) {
        return new Promise(function (resolve) {
          var tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put({ key: key, value: value, modified: modified });
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        });
      });
    }).catch(function () { return false; });
  }

  function setSyncStatus(mode) {
    var dot = document.getElementById('driveDot');
    var label = document.getElementById('driveLabel');
    if (!dot || !label) return;
    dot.className = 'drive-dot' + (mode === 'connected' || mode === 'ok' ? ' is-connected' : mode === 'sync' ? ' is-syncing' : mode === 'error' ? ' is-error' : '');
    var texts = { idle: 'Drive : non connecté', connected: 'Drive : connecté', ok: 'Drive : synchronisé', sync: 'Drive : synchro…', error: 'Drive : erreur' };
    label.textContent = texts[mode] || texts.idle;
  }

  function hasValidToken() { return !!accessToken && Date.now() < tokenExpiresAt - 5000; }

  function driveFetch(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + accessToken;
    return fetch(url, opts).then(function (res) { if (!res.ok) throw new Error('Drive API ' + res.status); return res; });
  }
  function driveFileName(key) { return 'storage__' + APP_NS + '__' + key + '.json'; }
  function driveFindFile(key) {
    var q = encodeURIComponent("name='" + driveFileName(key) + "' and trashed=false");
    var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)';
    return driveFetch(url).then(function (res) { return res.json(); }).then(function (data) { return (data.files && data.files[0]) || null; });
  }
  function driveGetRecord(fileId) {
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')
      .then(function (res) { return res.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return null; } });
  }
  function driveCreateFile(key, record) {
    var boundary = 'gdsyncbound';
    var metadata = { name: driveFileName(key), parents: ['appDataFolder'] };
    var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(record) + '\r\n' + '--' + boundary + '--';
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body
    });
  }
  function driveUpdateFile(fileId, record) {
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(record)
    });
  }
  function drivePushRecord(key, record) {
    return driveFindFile(key).then(function (existing) { return existing ? driveUpdateFile(existing.id, record) : driveCreateFile(key, record); });
  }

  async function syncOneKey(key, firstConnect) {
    var local = await idbGet(key);
    var existing = await driveFindFile(key);
    if (!existing) { if (local) await drivePushRecord(key, local); return false; }
    var remote = await driveGetRecord(existing.id);
    if (!remote) return false;
    if (firstConnect || !local || remote.modified > local.modified) {
      var changed = !(local && local.value === remote.value);
      await idbSet(key, remote.value, remote.modified);
      return changed;
    } else if (local.modified > remote.modified) {
      await driveUpdateFile(existing.id, local);
    }
    return false;
  }

  async function syncAllFromDrive(firstConnect) {
    setSyncStatus('sync');
    try {
      var anyChange = false;
      for (var i = 0; i < ALL_KEYS.length; i++) {
        if (await syncOneKey(ALL_KEYS[i], firstConnect)) anyChange = true;
      }
      setSyncStatus('ok');
      if (anyChange && typeof window.onHubDataChanged === 'function') window.onHubDataChanged();
    } catch (e) {
      setSyncStatus('error');
      console.error('[DriveSync]', e);
    }
  }

  function onTokenReceived(resp) {
    if (resp.error) { setSyncStatus('error'); return; }
    var isFirstConnect = localStorage.getItem(CONNECTED_FLAG) !== '1';
    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in * 1000);
    localStorage.setItem(CONNECTED_FLAG, '1');
    setSyncStatus('connected');
    syncAllFromDrive(isFirstConnect);
  }

  function initGis() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { setTimeout(initGis, 300); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: onTokenReceived });
    document.getElementById('btnDriveConnect').addEventListener('click', function () {
      tokenClient.requestAccessToken({ prompt: hasValidToken() ? '' : 'consent' });
    });
    document.getElementById('btnForceSync').addEventListener('click', function () {
      if (!hasValidToken()) { alert('Connecte-toi d\'abord à Drive.'); return; }
      idbGet('tools').then(function (local) {
        if (!local) { alert('Rien en local à synchroniser.'); return; }
        setSyncStatus('sync');
        drivePushRecord('tools', local).then(function () {
          setSyncStatus('ok'); alert('Synchro forcée : OK');
        }).catch(function (e) { setSyncStatus('error'); alert('Erreur : ' + e.message); });
      });
    });
    if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' });
    setInterval(function () { if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' }); }, SILENT_REFRESH_MS);
  }
  initGis();

  window.storage = {
    get: async function (key) { var rec = await idbGet(key); return rec ? { key: key, value: rec.value, shared: false } : null; },
    set: async function (key, value) {
      var ok = await idbSet(key, value);
      if (!ok) return null;
      if (hasValidToken()) {
        setSyncStatus('sync');
        idbGet(key).then(function (rec) { return drivePushRecord(key, rec); })
          .then(function () { setSyncStatus('ok'); })
          .catch(function (e) { setSyncStatus('error'); console.error('[DriveSync]', e); });
      }
      return { key: key, value: value, shared: false };
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  var COLORS = ['#e0a52c', '#5c8a5c', '#4a90c2', '#c1543f', '#9a6fc2', '#5cb3a8'];
  var tools = [];
  var editingId = null;

  var els = {
    grid: document.getElementById('grid'),
    empty: document.getElementById('emptyState'),
    search: document.getElementById('search'),
    modal: document.getElementById('toolModal'),
    modalTitle: document.getElementById('modalTitle'),
    fName: document.getElementById('fName'),
    fUrl: document.getElementById('fUrl'),
    fDesc: document.getElementById('fDesc'),
    swatches: document.getElementById('swatches'),
    btnSave: document.getElementById('btnSave'),
    btnCancel: document.getElementById('btnCancel'),
    btnDelete: document.getElementById('btnDelete')
  };
  var selectedColor = COLORS[0];

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var q = els.search.value.trim().toLowerCase();
    var filtered = tools.filter(function (t) { return !q || t.name.toLowerCase().indexOf(q) !== -1; });
    els.empty.classList.toggle('hidden', tools.length > 0);
    els.grid.innerHTML = filtered.map(function (t) {
      return '<div class="card" style="--card-accent:' + t.color + '" data-id="' + t.id + '">' +
        '<div class="card-top"><div class="card-title">' + escapeHtml(t.name) + '</div>' +
        '<button class="gear-btn" data-edit="' + t.id + '">&#9881;</button></div>' +
        '<div class="card-desc">' + escapeHtml(t.desc) + '</div>' +
        '<div class="card-actions"><button class="primary" data-open="' + t.id + '">Ouvrir</button></div>' +
        '</div>';
    }).join('');
    els.grid.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var t = tools.find(function (x) { return x.id === btn.getAttribute('data-open'); });
        if (t) window.open(t.url, '_blank');
      });
    });
    els.grid.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openModal(tools.find(function (x) { return x.id === btn.getAttribute('data-edit'); }));
      });
    });
  }

  function renderSwatches() {
    els.swatches.innerHTML = COLORS.map(function (c) {
      return '<div class="swatch' + (c === selectedColor ? ' selected' : '') + '" style="background:' + c + '" data-color="' + c + '"></div>';
    }).join('');
    els.swatches.querySelectorAll('.swatch').forEach(function (sw) {
      sw.addEventListener('click', function () { selectedColor = sw.getAttribute('data-color'); renderSwatches(); });
    });
  }

  function openModal(tool) {
    editingId = tool ? tool.id : null;
    els.modalTitle.textContent = tool ? 'Modifier l\'outil' : 'Ajouter un outil';
    els.fName.value = tool ? tool.name : '';
    els.fUrl.value = tool ? tool.url : '';
    els.fDesc.value = tool ? tool.desc : '';
    selectedColor = tool ? tool.color : COLORS[tools.length % COLORS.length];
    els.btnDelete.style.display = tool ? 'inline-block' : 'none';
    renderSwatches();
    els.modal.classList.remove('hidden');
    setTimeout(function () { els.fName.focus(); }, 50);
  }
  function closeModal() { els.modal.classList.add('hidden'); editingId = null; }

  async function persist() {
    await window.storage.set('tools', JSON.stringify(tools), false);
  }

  async function loadFromStorage() {
    try {
      var res = await window.storage.get('tools', false);
      tools = (res && res.value) ? JSON.parse(res.value) : [];
    } catch (e) { tools = []; }
    render();
  }

  els.btnSave.addEventListener('click', async function () {
    var name = els.fName.value.trim();
    var url = els.fUrl.value.trim();
    if (!name || !url) { alert('Le nom et l\'URL sont obligatoires.'); return; }
    if (!/^https?:\/\//i.test(url)) { alert('L\'URL doit commencer par http:// ou https://'); return; }
    if (editingId) {
      var t = tools.find(function (x) { return x.id === editingId; });
      t.name = name; t.url = url; t.desc = els.fDesc.value.trim(); t.color = selectedColor;
    } else {
      tools.push({ id: 't' + Date.now() + Math.random().toString(36).slice(2, 7), name: name, url: url, desc: els.fDesc.value.trim(), color: selectedColor });
    }
    await persist();
    render();
    closeModal();
  });

  els.btnDelete.addEventListener('click', async function () {
    if (!editingId) return;
    if (!confirm('Supprimer cet outil du Hub ?')) return;
    tools = tools.filter(function (x) { return x.id !== editingId; });
    await persist();
    render();
    closeModal();
  });

  els.btnCancel.addEventListener('click', closeModal);
  document.getElementById('btnAdd').addEventListener('click', function () { openModal(null); });
  document.getElementById('btnAddEmpty').addEventListener('click', function () { openModal(null); });
  els.search.addEventListener('input', render);

  window.onHubDataChanged = function () { loadFromStorage(); };

  loadFromStorage();
})();
</script>
</body>
</html>
