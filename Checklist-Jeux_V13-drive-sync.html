  async function handleGameFormSubmit(e) {
    e.preventDefault();
    var name = document.getElementById('f-name').value.trim();
    if (!name) {
      showToast('Indique un nom de jeu pour continuer.', 'error');
      document.getElementById('f-name').focus();
      return;
    }

    var consoleVal = document.getElementById('f-console').value;
    if (consoleVal === '__new__') {
      var newName = document.getElementById('f-console-new').value.trim();
      if (!newName) { showToast('Indique le nom de la nouvelle console.', 'error'); return; }
      var existing = state.consoles.find(function (c) { return normalize(c.name) === normalize(newName); });
      if (existing) {
        consoleVal = existing.id;
      } else {
        var newConsole = { id: uid(), name: newName, description: '', setupId: null, image: null };
        state.consoles.push(newConsole);
        await persistConsoles();
        consoleVal = newConsole.id;
      }
    }

    var isUpcoming = document.getElementById('toggle-upcoming').dataset.value === 'true';
    var start = document.getElementById('f-start').value || null;
    var end = document.getElementById('f-end').value || null;
    if (!isUpcoming && start && end && end < start) {
      showToast('La date de fin doit être après la date de début.', 'error');
      return;
    }

    var estVal = document.getElementById('f-estimated').value;
    var actVal = document.getElementById('f-actual').value;
    var purchaseVal = document.getElementById('toggle-purchase').dataset.value;
    var statusVal = document.getElementById('toggle-status').dataset.value;
    var subServiceVal = document.getElementById('f-subscription-service').value.trim();
    var releaseDateVal = document.getElementById('f-release-date').value || null;
    var completed100Val = statusVal === 'fait' ? document.getElementById('f-completed-100').checked : false;
    var coopVal = document.getElementById('f-coop').checked;
    var coopMaxPlayersRaw = document.getElementById('f-coop-max-players').value;

    var gameData = {
      name: name,
      consoleId: consoleVal,
      purchaseStatus: purchaseVal,
      subscriptionService: purchaseVal === 'abonnement' ? subServiceVal : '',
      status: statusVal,
      startDate: isUpcoming ? null : start,
      endDate: isUpcoming ? null : end,
      estimatedDuration: isUpcoming ? null : (estVal === '' ? null : Number(estVal)),
      actualDuration: isUpcoming ? null : (actVal === '' ? null : Number(actVal)),
      upcoming: isUpcoming,
      releaseDate: isUpcoming ? releaseDateVal : null,
      completed100: completed100Val,
      rating: isUpcoming ? 0 : pendingRating,
      coop: coopVal,
      coopOnline: coopVal ? document.getElementById('f-coop-online').checked : false,
      coopLocal: coopVal ? document.getElementById('f-coop-local').checked : false,
      coopMaxPlayers: (coopVal && coopMaxPlayersRaw !== '') ? Number(coopMaxPlayersRaw) : null,
      image: pendingImageData || null
    };

    if (state.editingId) {
      var idx = state.games.findIndex(function (x) { return x.id === state.editingId; });
      if (idx !== -1) state.games[idx] = Object.assign({}, state.games[idx], gameData);
    } else {
      gameData.id = uid();
      gameData.runNumber = 1;
      gameData.runs = [];
      gameData.createdAt = Date.now();
      gameData.priority = Date.now();
      state.games.push(gameData);
    }

    var wasEditing = !!state.editingId;
    await persistGames();
    closeGameModal();
    renderAll();
    showToast(wasEditing ? 'Jeu mis à jour.' : 'Jeu ajouté à la liste.');
  }

    g.status = value;
    if (value === 'en_cours' && !g.startDate) g.startDate = todayStr();

  async function moveGamePriority(id, direction) {
    var list = getBacklogGames().filter(function (g) { return g.status === 'a_faire'; });
    list.sort(getComparator('default', 'a_faire'));
    var idx = list.findIndex(function (g) { return g.id === id; });
    if (idx === -1) return;
    var swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= list.length) return;
    var tmp = list[idx].priority;
    list[idx].priority = list[swapIdx].priority;
    list[swapIdx].priority = tmp;
    await persistGames();
    renderBoard();
  }

  async function markAsReleased(id) {
    var g = state.games.find(function (x) { return x.id === id; });
    if (!g) return;
    g.upcoming = false;
    if (!g.status) g.status = 'a_faire';
    await persistGames();
    renderAll();
    showToast('« ' + g.name + ' » déplacé dans le backlog.');

  function autoReleaseUpcomingGames() {
    var today = todayStr();
    var count = 0;
    state.games.forEach(function (g) {
      if (g.upcoming && g.releaseDate && g.releaseDate <= today) {
        g.upcoming = false;
        if (!g.status) g.status = 'a_faire';
        count++;
      }
    });
    return count;
  }

    document.getElementById('modal-confirm-overlay').classList.add('hidden');
    confirmCallback = null;
  }

  /* ================= Toast ================= */
  function showToast(message, type) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast' + (type === 'error' ? ' toast-error' : '');
    requestAnimationFrame(function () { el.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  /* ================= Fichier autonome ================= */
  function downloadFileWithData() {
    try {
      var payload = JSON.stringify({ games: state.games, consoles: state.consoles, setups: state.setups, theme: state.theme });
      // Échappe les "<" pour ne jamais risquer de casser la balise qui contient ces données
      // (sans danger : dans du JSON valide, un "<" n'apparaît que dans une chaîne, où \u003c est un
      // échappement standard correctement relu par JSON.parse).
      var safePayload = payload.replace(/</g, '\\u003c');
      var newBlock = '<script type="application/json" id="app-data">' + safePayload + '<' + '/script>';
      var html = PRISTINE_HTML.replace(
        /<script type="application\/json" id="app-data">[\s\S]*?<\/script>/,
        newBlock
      );
      if (html === PRISTINE_HTML) throw new Error('bloc de données introuvable');

      var blob = new Blob(['<!DOCTYPE html>\n' + html], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = buildDownloadFilename() + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Fichier téléchargé. Remplacez-le sur votre Drive pour le retrouver à jour partout.');
    } catch (e) {
      showToast('Erreur lors de la génération du fichier.', 'error');
    }
  }

  /* ================= Export / Import ================= */
  function exportData() {
    var data = { games: state.games, consoles: state.consoles, setups: state.setups, theme: state.theme, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ludotheque-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Export téléchargé.');
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!Array.isArray(data.games)) throw new Error('format invalide');
        openConfirm('Importer ' + data.games.length + ' jeu(x) ? Cela remplacera vos données actuelles.', async function () {
          var newConsoles = migrateConsoles(Array.isArray(data.consoles) ? data.consoles : []);
          if (!newConsoles.length) newConsoles = buildDefaultConsoles();
          state.consoles = newConsoles;
          state.setups = migrateSetups(Array.isArray(data.setups) ? data.setups : []);
          state.games = migrateGames(data.games, state.consoles);
          if (data.theme) applyTheme(data.theme, true);
          await persistGames();
          await persistConsoles();
          await persistSetups();
          renderAll();
          showToast('Import réussi.');
        });
      } catch (err) {
        showToast('Ce fichier ne semble pas valide.', 'error');
      }
    };
    reader.readAsText(file);
  }

  /* ================= Événements ================= */
  function bindEvents() {
    document.getElementById('input-search').addEventListener('input', function (e) {
      state.filter.search = e.target.value;
      if (state.view === 'upcoming') renderUpcoming(); else renderBoard();
    });
    document.getElementById('filter-purchase').addEventListener('change', function (e) {
      state.filter.purchase = e.target.value;
      renderBoard();
    });
    document.getElementById('filter-length').addEventListener('change', function (e) {
      state.filter.length = e.target.value;
      renderBoard();
    });
    document.getElementById('sort-select').addEventListener('change', function (e) {
      state.sort = e.target.value;
      renderBoard();
    });

    document.getElementById('view-backlog').addEventListener('click', function () { switchView('backlog'); });
    document.getElementById('view-upcoming').addEventListener('click', function () { switchView('upcoming'); });

    document.getElementById('btn-theme-toggle').addEventListener('click', function () {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark', true);
    });

    document.getElementById('console-tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('.tab');
      if (!btn) return;
      state.filter.console = btn.dataset.console;
      renderConsoleTabs();
      renderStats();
      if (state.view === 'upcoming') renderUpcoming(); else renderBoard();
    });

    document.getElementById('board').addEventListener('click', function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var id = card.dataset.id;
      var actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        var action = actionBtn.dataset.action;
        if (action === 'status') { quickSetStatus(id, actionBtn.dataset.value); return; }
        if (action === 'move-up') { moveGamePriority(id, -1); return; }
        if (action === 'move-down') { moveGamePriority(id, 1); return; }
        if (action === 'edit') { openGameModal(id); return; }
        if (action === 'delete') { requestDeleteGame(id); return; }
      } else {
        openGameModal(id);
      }
    });

    document.getElementById('upcoming-list').addEventListener('click', function (e) {
      var card = e.target.closest('.upcoming-card');
      if (!card) return;
      var id = card.dataset.id;
      var actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        var action = actionBtn.dataset.action;
        if (action === 'release') { markAsReleased(id); return; }
        if (action === 'edit') { openGameModal(id); return; }
        if (action === 'delete') { requestDeleteGame(id); return; }
      } else {
        openGameModal(id);
      }
    });

    document.getElementById('btn-add-game').addEventListener('click', function () { openGameModal(null, state.view === 'upcoming'); });
    document.getElementById('btn-close-game-modal').addEventListener('click', closeGameModal);
    document.getElementById('btn-cancel-game').addEventListener('click', closeGameModal);
    document.getElementById('modal-game-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-game-overlay') closeGameModal();
    });
    document.getElementById('form-game').addEventListener('submit', handleGameFormSubmit);
    document.getElementById('btn-delete-game').addEventListener('click', function () {
      if (state.editingId) requestDeleteGame(state.editingId);
    });

    document.getElementById('f-console').addEventListener('change', function (e) {
      var newField = document.getElementById('new-console-field');
      newField.hidden = e.target.value !== '__new__';
      if (!newField.hidden) document.getElementById('f-console-new').focus();
    });

    document.getElementById('toggle-upcoming').addEventListener('click', function (e) {
      var btn = e.target.closest('.toggle-btn');
      if (!btn) return;
      setToggleValue(this, btn.dataset.value);
      updateUpcomingFieldsVisibility();
    });

    document.getElementById('toggle-purchase').addEventListener('click', function (e) {
      var btn = e.target.closest('.toggle-btn');
      if (!btn) return;
      setToggleValue(this, btn.dataset.value);
      document.getElementById('field-subscription-service').hidden = btn.dataset.value !== 'abonnement';
    });
    document.getElementById('toggle-status').addEventListener('click', function (e) {
      var btn = e.target.closest('.toggle-btn');
      if (!btn) return;
      setToggleValue(this, btn.dataset.value);
      autoFillDatesForStatus(btn.dataset.value);
      updateFormHints();
      updateCompleted100Visibility();
    });

    ['f-start', 'f-end', 'f-estimated'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', updateFormHints);
    });

    document.getElementById('f-image-file').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (file) handleImageFileSelect(file);
      e.target.value = '';
    });
    document.getElementById('f-image-url').addEventListener('input', function (e) {
      pendingImageData = e.target.value.trim() || null;
      var box = document.getElementById('image-preview-box');
      box.innerHTML = pendingImageData ? '<img src="' + esc(pendingImageData) + '" alt="" />' : ICONS.image;
      document.getElementById('btn-remove-image').hidden = !pendingImageData;
    });
    document.getElementById('btn-remove-image').addEventListener('click', function () {
      pendingImageData = null;
      updateImagePreview(null);
    });

    document.getElementById('star-picker').addEventListener('click', function (e) {
      var r = computeRatingFromStarEvent(e);
      if (r === null) return;
      pendingRating = r;
      renderStarPicker(pendingRating);
    });
    document.getElementById('star-picker').addEventListener('mousemove', function (e) {
      var r = computeRatingFromStarEvent(e);
      if (r === null) return;
      renderStarPicker(r);
    });
    document.getElementById('star-picker').addEventListener('mouseleave', function () {
      renderStarPicker(pendingRating);
    });
    document.getElementById('btn-clear-rating').addEventListener('click', function () {
      pendingRating = 0;
      renderStarPicker(0);
    });

    document.getElementById('f-coop').addEventListener('change', function (e) {
      document.getElementById('coop-details').classList.toggle('hidden', !e.target.checked);
    });

    document.getElementById('btn-replay').addEventListener('click', function () {
      if (!state.editingId) return;
      var g = state.games.find(function (x) { return x.id === state.editingId; });
      if (!g) return;
      openConfirm('Démarrer un nouveau run de « ' + g.name + ' » ? Le run précédent sera archivé dans l\'historique.', async function () {
        g.runs = g.runs || [];
        g.runs.push({ n: g.runNumber || 1, startDate: g.startDate, endDate: g.endDate, actualDuration: g.actualDuration });
        g.runNumber = (g.runNumber || 1) + 1;
        g.startDate = null;
        g.endDate = null;
        g.actualDuration = null;
        g.status = 'en_cours';
        await persistGames();
        closeGameModal();
        renderAll();
        showToast('Nouveau run démarré !');
      });
    });

    document.getElementById('btn-manage-consoles').addEventListener('click', openConsolesModal);
    document.getElementById('btn-close-consoles-modal').addEventListener('click', closeConsolesModal);
    document.getElementById('modal-consoles-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-consoles-overlay') closeConsolesModal();
    });
    document.getElementById('btn-add-console').addEventListener('click', addConsoleFromModal);
    document.getElementById('input-new-console').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addConsoleFromModal(); }
    });
    document.getElementById('console-list').addEventListener('click', function (e) {
      var photoBtn = e.target.closest('button[data-console-photo]');
      if (photoBtn) {
        consolePhotoTargetId = photoBtn.dataset.consolePhoto;
        document.getElementById('console-photo-file').click();
        return;
      }
      var removePhotoBtn = e.target.closest('button[data-remove-console-photo]');
      if (removePhotoBtn) {
        var cPhoto = state.consoles.find(function (x) { return x.id === removePhotoBtn.dataset.removeConsolePhoto; });
        if (cPhoto) {
          cPhoto.image = null;
          persistConsoles().then(function () { renderConsolesList(); renderAll(); });
        }
        return;
      }
      var btn = e.target.closest('button[data-remove-console]');
      if (!btn) return;
      removeConsole(btn.dataset.removeConsole);
    });
    document.getElementById('console-photo-file').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (file && consolePhotoTargetId) handleConsolePhotoSelect(consolePhotoTargetId, file);
      e.target.value = '';
      consolePhotoTargetId = null;
    });
    document.getElementById('console-list').addEventListener('change', async function (e) {
      var descInput = e.target.closest('.console-desc-input');
      if (descInput) {
        var c = state.consoles.find(function (x) { return x.id === descInput.dataset.consoleId; });
        if (c) { c.description = descInput.value.trim(); await persistConsoles(); renderAll(); }
        return;
      }
      var setupSelect = e.target.closest('.console-setup-select');
      if (setupSelect) {
        var c2 = state.consoles.find(function (x) { return x.id === setupSelect.dataset.consoleId; });
        if (c2) { c2.setupId = setupSelect.value || null; await persistConsoles(); renderAll(); }
      }
    });

    document.getElementById('btn-add-setup').addEventListener('click', addSetupFromModal);
    document.getElementById('input-new-setup').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addSetupFromModal(); }
    });
    document.getElementById('setup-list').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-remove-setup]');
      if (!btn) return;
      removeSetup(btn.dataset.removeSetup);
    });

    document.getElementById('btn-confirm-ok').addEventListener('click', async function () {
      var cb = confirmCallback;
      closeConfirm();
      if (cb) await cb();
    });
    document.getElementById('btn-confirm-cancel').addEventListener('click', closeConfirm);
    document.getElementById('modal-confirm-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-confirm-overlay') closeConfirm();
    });

    document.getElementById('btn-download-file').addEventListener('click', downloadFileWithData);
    document.getElementById('btn-export').addEventListener('click', exportData);
    document.getElementById('input-import').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (file) importDataFromFile(file);
      e.target.value = '';
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!document.getElementById('modal-confirm-overlay').classList.contains('hidden')) { closeConfirm(); return; }
      if (!document.getElementById('modal-consoles-overlay').classList.contains('hidden')) { closeConsolesModal(); return; }
      if (!document.getElementById('modal-game-overlay').classList.contains('hidden')) { closeGameModal(); return; }
    });
  }

  /* ================= Initialisation ================= */
  async function init() {
    var embedded = readEmbeddedData();
    var storageGames = await loadGames();
    var storageConsoles = await loadConsoles();
    var storageSetups = await loadSetups();
    var storageTheme = await loadTheme();

    var rawConsoles = (storageConsoles && storageConsoles.length) ? storageConsoles
      : (embedded && Array.isArray(embedded.consoles) && embedded.consoles.length) ? embedded.consoles
      : null;
    var needsConsolesPersist = false;
    var consoles;
    if (rawConsoles) {
      consoles = migrateConsoles(rawConsoles);
    } else {
      consoles = buildDefaultConsoles();
      needsConsolesPersist = true;
    }
    state.consoles = consoles;

    var rawSetups = (storageSetups && storageSetups.length) ? storageSetups
      : (embedded && Array.isArray(embedded.setups) && embedded.setups.length) ? embedded.setups
      : [];
    state.setups = migrateSetups(rawSetups);

    var theme = storageTheme || (embedded && embedded.theme) || 'dark';
    applyTheme(theme, false);

    var rawGames = (storageGames && storageGames.length) ? storageGames
      : (embedded && Array.isArray(embedded.games) && embedded.games.length) ? embedded.games
      : [];
    var consolesLenBefore = state.consoles.length;
    state.games = migrateGames(rawGames, state.consoles);
    if (state.consoles.length !== consolesLenBefore) needsConsolesPersist = true;
    var releasedCount = autoReleaseUpcomingGames();

    if (needsConsolesPersist) await persistConsoles();
    await persistGames();

    document.getElementById('loading-overlay').classList.add('hidden');
    renderAll();

    var noticeParts = [];
    if (releasedCount > 0) {
      noticeParts.push(releasedCount + ' jeu' + (releasedCount > 1 ? 'x' : '') + ' passé' + (releasedCount > 1 ? 's' : '') + ' en "à faire" (date de sortie atteinte).');
    }
    if (!window.storage) {
      noticeParts.push('Mode fichier local : pensez à cliquer sur « Télécharger le fichier » pour conserver vos modifications.');
    }
    if (noticeParts.length) showToast(noticeParts.join(' '));
  }

  bindEvents();
  init();
})();
</script></body></html>
