<!DOCTYPE html>
<html lang="fr" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine &amp; Charges</title>
<meta name="description" content="Suivi des routines, actions court / moyen / long terme et idées de projet — checks, échéances, responsables, pièces jointes, emplacements de stockage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #14211C;
    --card: #F2EAD3;
    --ink: #241C14;
    --moss: #5B7A4A;
    --ochre: #B8842E;
    --brick: #9C3B2E;
    --indigo: #3F5D7A;
    --gold: #C9A227;
    --teal: #3F7A6B;

    --bg-raised: #1C2C25;
    --card-dim: #C9BB98;
    --text-strong: #F2EAD3;
    --ink-soft: #5B5041;
    --moss-ink: #3A4E2F;
    --ochre-ink: #7A551C;
    --brick-ink: #6E2A20;
    --indigo-ink: #25384A;
    --gold-ink: #8C6D14;
    --teal-ink: #2A5147;
    --line: rgba(36,28,20,0.16);
    --line-dark: rgba(242,234,211,0.14);
    --input-bg: #FBF5E4;
    --chip-bg-card: rgba(36,28,20,0.06);
    --ghost-hover-bg: rgba(242,234,211,0.06);

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
    --radius-s: 4px; --radius-m: 8px; --radius-l: 14px;

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

    --shadow-card: 0 1px 2px rgba(10,16,13,.4), 0 8px 20px -10px rgba(10,16,13,.55);
    --shadow-modal: 0 24px 64px -20px rgba(0,0,0,.65);
  }
  [data-theme="light"] {
    --bg: #E3D9BE;
    --card: #FFFCF2;
    --bg-raised: #EEE5CC;
    --card-dim: #6B5D45;
    --text-strong: #241C14;
    --line-dark: rgba(36,28,20,0.14);
    --ghost-hover-bg: rgba(36,28,20,0.05);
    --shadow-card: 0 1px 2px rgba(60,48,24,.10), 0 8px 20px -10px rgba(60,48,24,.22);
    --shadow-modal: 0 24px 64px -20px rgba(40,30,15,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text-strong); font-family: var(--font-body); font-size: 15px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; color-scheme: dark; transition: background-color .2s ease, color .2s ease; }
  [data-theme="light"] body { color-scheme: light; }
  .hidden { display: none !important; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { max-width: 1180px; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-8); }
  svg.ic { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Header ---------- */
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-4); }
  .header-title { display: flex; align-items: center; gap: var(--space-3); }
  .logo { width: 36px; height: 36px; color: var(--ochre); flex-shrink: 0; }
  .header-title h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 3.2vw, 32px); color: var(--text-strong); margin: 0; letter-spacing: -0.01em; }
  .tagline { margin: 3px 0 0; color: var(--card-dim); font-size: 12.5px; font-family: var(--font-mono); letter-spacing: 0.01em; }
  .header-actions { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; padding: 9px 14px; border-radius: var(--radius-m); border: 1px solid transparent; cursor: pointer; transition: transform .12s ease, background .15s ease, border-color .15s ease; white-space: nowrap; line-height: 1.2; }
  .btn svg { width: 14px; height: 14px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--ochre); color: #1B1206; }
  .btn-primary:hover { background: #C6934A; }
  .btn-ghost { background: transparent; border-color: var(--line-dark); color: var(--text-strong); }
  .btn-ghost:hover { border-color: var(--card-dim); background: var(--ghost-hover-bg); }
  .btn-danger { background: var(--brick); color: #F7EFE0; }
  .btn-danger:hover { background: #B34838; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  /* boutons "ghost" posés sur fond clair (cartes, modales) */
  .charge-card .btn-ghost, .panel-card .btn-ghost, .modal .btn-ghost { color: var(--ink); border-color: var(--line); }
  .charge-card .btn-ghost:hover, .panel-card .btn-ghost:hover, .modal .btn-ghost:hover { border-color: var(--ink-soft); background: var(--chip-bg-card); }
  .btn-ghost.is-warn:hover { border-color: var(--brick); color: var(--brick-ink); }

  .drive-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--card-dim); transition: background .2s ease; }
  .drive-dot.is-connected { background: #7FA86A; }
  .drive-dot.is-syncing { background: var(--ochre); animation: drive-pulse 1s ease-in-out infinite; }
  .drive-dot.is-error { background: #D0604F; }
  @keyframes drive-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .theme-toggle { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-m); border: 1px solid var(--line-dark); background: transparent; color: var(--text-strong); cursor: pointer; flex-shrink: 0; }
  .theme-toggle:hover { border-color: var(--card-dim); background: var(--ghost-hover-bg); }
  .theme-toggle svg { width: 17px; height: 17px; }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

  /* ---------- Navigation + recherche ---------- */
  .navwrap { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 10px 0 12px; margin: 0 0 var(--space-4); border-bottom: 1px solid var(--line-dark); }
  .navrow { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
  .tab { padding: 8px 14px; border-radius: var(--radius-m); border: 1px solid var(--line-dark); background: transparent; color: var(--text-strong); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .tab:hover { background: var(--ghost-hover-bg); }
  .tab.active { background: var(--ochre); border-color: var(--ochre); color: #1B1206; }
  .tab-count { font-family: var(--font-mono); font-size: 11px; opacity: .7; margin-left: 6px; font-weight: 500; }
  .searchbox { position: relative; flex: 0 1 230px; min-width: 200px; margin-left: auto; }
  .searchbox input { width: 100%; padding: 9px 34px 9px 12px; border-radius: var(--radius-m); border: 1px solid var(--line-dark); background: var(--card); color: var(--ink); font-size: 13.5px; }
  .searchbox input::placeholder { color: var(--ink-soft); opacity: .8; }
  .searchbox .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 700px) { .navwrap { position: static; } .searchbox { flex-basis: 100%; } }

  /* ---------- Titres de liste + filtres ---------- */
  .list-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .list-head h2 { font-family: var(--font-display); font-size: 22px; margin: 0; color: var(--text-strong); font-weight: 600; }
  .list-head .sub { color: var(--card-dim); font-size: 12.5px; font-family: var(--font-mono); margin-top: 2px; }
  .list-tools { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--space-3); }
  .fchip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-dark); background: transparent; color: var(--text-strong); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .fchip:hover { background: var(--ghost-hover-bg); }
  .fchip.active { background: var(--ochre); border-color: var(--ochre); color: #1B1206; }
  .fchip .n { opacity: .7; margin-left: 5px; font-family: var(--font-mono); font-weight: 500; }
  .section-title { font-family: var(--font-display); font-size: 18px; margin: var(--space-5) 0 var(--space-3); color: var(--text-strong); font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
  .section-title .n { font-family: var(--font-mono); font-size: 12px; color: var(--card-dim); font-weight: 500; }

  /* ---------- Cartes de charge ---------- */
  .charge-card { background: var(--card); color: var(--ink); border-radius: var(--radius-l); box-shadow: var(--shadow-card); margin-bottom: 12px; border-left: 5px solid var(--card-dim); overflow: hidden; scroll-margin-top: 110px; }
  .charge-card.is-late { border-left-color: var(--brick); }
  .charge-card.is-soon { border-left-color: var(--ochre); }
  .charge-card.is-ok { border-left-color: var(--moss); }
  .charge-card.st-a_faire { border-left-color: var(--indigo); }
  .charge-card.st-en_cours { border-left-color: var(--ochre); }
  .charge-card.st-attente { border-left-color: var(--teal); }
  .charge-card.st-cloture { border-left-color: var(--moss); }
  .charge-card.st-cloture .card-title { color: var(--ink-soft); }
  .charge-card.flash { animation: card-flash 1.8s ease; }
  @keyframes card-flash { 0% { box-shadow: 0 0 0 3px var(--ochre), var(--shadow-card); } 100% { box-shadow: var(--shadow-card); } }
  .card-h { margin: 0; font: inherit; }
  .card-head { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: none; padding: 14px 16px 14px 12px; color: inherit; }
  .card-head:hover { background: var(--chip-bg-card); }
  .chev { width: 18px; height: 18px; transition: transform .15s ease; color: var(--ink-soft); flex-shrink: 0; }
  .card-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .card-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip-bg-card); color: var(--ink-soft); white-space: nowrap; line-height: 1.6; }
  .chip svg { width: 12px; height: 12px; }
  .chip.mono { font-family: var(--font-mono); font-weight: 500; }
  .chip.c-indigo { background: rgba(63,93,122,.16); color: var(--indigo-ink); }
  .chip.c-ochre { background: rgba(184,132,46,.22); color: var(--ochre-ink); }
  .chip.c-teal { background: rgba(63,122,107,.18); color: var(--teal-ink); }
  .chip.c-moss { background: rgba(91,122,74,.22); color: var(--moss-ink); }
  .chip.c-brick { background: rgba(156,59,46,.16); color: var(--brick-ink); }
  .head-progress { flex-shrink: 0; display: flex; align-items: center; gap: 8px; min-width: 90px; justify-content: flex-end; }
  .bar { width: 64px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--moss); border-radius: 3px; }
  .prog-num { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .card-body { padding: 4px 18px 16px 18px; border-top: 1px solid var(--line); }
  .card-note { font-size: 13px; color: var(--ink-soft); font-style: italic; margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta-strip { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 12px 0 4px; font-size: 12.5px; color: var(--ink-soft); }
  .meta-strip .mf { display: flex; align-items: center; gap: 7px; }
  .meta-strip .mf b { color: var(--ink); font-weight: 600; }
  .mini-inp { padding: 4px 7px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--input-bg); color: var(--ink); font-size: 12.5px; font-family: var(--font-mono); }
  .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; padding: 9px 12px; border-radius: var(--radius-s); background: rgba(91,122,74,.18); color: var(--moss-ink); font-size: 13px; font-weight: 600; }
  .banner.warn { background: rgba(184,132,46,.2); color: var(--ochre-ink); }

  .rows { list-style: none; padding: 0; margin: 8px 0 0; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .chk { flex: 0 0 20px; width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--moss); cursor: pointer; }
  /* Les surfaces crème restent claires même en thème sombre : contrôles natifs (cases, radios, dates) en schéma clair. */
  .charge-card, .panel-card, .stat-card, .modal { color-scheme: light; }
  .row .ico { flex: 0 0 20px; width: 20px; height: 20px; color: var(--ink-soft); margin-top: 1px; opacity: .7; }
  .row-main { flex: 1; min-width: 0; }
  .row .txt { font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.is-done .txt { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(36,28,20,.4); }
  .row.t-note .txt { font-size: 13px; color: var(--ink-soft); font-style: italic; }
  .row.t-titre { border-bottom: none; padding: 14px 2px 2px; }
  .row.t-titre .txt { font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ochre-ink); }
  .row-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .row-actions { flex: 0 0 auto; display: flex; opacity: .5; transition: opacity .12s ease; }
  .row:hover .row-actions, .row:focus-within .row-actions { opacity: 1; }
  @media (hover: none) { .row-actions { opacity: .85; } }
  .ibtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--ink-soft); border-radius: var(--radius-s); flex-shrink: 0; }
  .ibtn:hover { background: var(--chip-bg-card); color: var(--ink); }
  .ibtn.danger:hover { color: var(--brick); }
  .ibtn:disabled { opacity: .25; cursor: default; }
  .ibtn:disabled:hover { background: none; color: var(--ink-soft); }
  .ibtn svg { width: 15px; height: 15px; }
  .searchbox .ibtn { color: var(--ink-soft); }

  .addrow { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .addrow .inp { flex: 1; min-width: 0; }
  .addrow .sel { flex: 0 0 auto; width: auto; }

  .inp, .sel, .ta { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--input-bg); color: var(--ink); font-size: 13.5px; }
  .ta { resize: vertical; min-height: 70px; line-height: 1.45; }
  .inp.mono { font-family: var(--font-mono); font-size: 12.5px; }

  .blk { margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .blk-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: 8px; }
  .loc { display: flex; gap: 10px; align-items: flex-start; padding: 8px 8px 8px 10px; background: var(--chip-bg-card); border-radius: var(--radius-s); margin-bottom: 6px; }
  .loc > .ico { width: 16px; height: 16px; color: var(--ochre-ink); margin-top: 2px; flex-shrink: 0; }
  .loc-main { flex: 1; min-width: 0; }
  .loc-ctx { font-size: 10.5px; font-weight: 700; color: var(--ochre-ink); text-transform: uppercase; letter-spacing: .05em; }
  .loc-label { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .loc-path { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .loc-path a { color: var(--indigo-ink); }
  .hist-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .hist-row:last-child { border-bottom: none; }
  .hist-row .d { font-family: var(--font-mono); font-weight: 600; min-width: 92px; }
  .hist-row .s { font-family: var(--font-mono); color: var(--ink-soft); flex: 1; }
  .card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .card-foot .spacer { flex: 1; }
  mark { background: rgba(201,162,39,.45); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- Vue d'ensemble ---------- */
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; margin-bottom: var(--space-4); }
  .stat-card { background: var(--card); color: var(--ink); border-radius: var(--radius-m); padding: 12px 14px; box-shadow: var(--shadow-card); border-left: 4px solid var(--ochre); }
  .stat-card .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); font-weight: 700; }
  .stat-card .stat-value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
  .stat-card .stat-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .stat-card.a-moss { border-left-color: var(--moss); }
  .stat-card.a-brick { border-left-color: var(--brick); }
  .stat-card.a-indigo { border-left-color: var(--indigo); }
  .stat-card.a-teal { border-left-color: var(--teal); }
  .panel-card { background: var(--card); color: var(--ink); border-radius: var(--radius-l); padding: 18px 20px; box-shadow: var(--shadow-card); margin-bottom: var(--space-4); }
  .panel-card h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 12px; color: var(--ink); font-weight: 600; }
  .panel-card h2 .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); font-weight: 500; margin-left: 6px; }
  .dash-cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--space-4); align-items: start; }
  @media (max-width: 900px) { .dash-cols { grid-template-columns: 1fr; } }
  .agenda { list-style: none; margin: 0; padding: 0; }
  .ag-btn { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 9px 4px; color: inherit; }
  .agenda li:last-child .ag-btn { border-bottom: none; }
  .ag-btn:hover { background: var(--chip-bg-card); }
  .ag-date { flex: 0 0 auto; min-width: 104px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .ag-date small { display: block; font-weight: 500; font-size: 11px; }
  .ag-date.late { color: var(--brick-ink); }
  .ag-date.soon { color: var(--ochre-ink); }
  .ag-body { flex: 1; min-width: 0; }
  .ag-title { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
  .ag-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; overflow-wrap: anywhere; }
  .ag-side { flex: 0 0 auto; align-self: center; }
  .empty-inline { font-size: 13px; color: var(--ink-soft); padding: 6px 0; }
  .empty-state { text-align: center; padding: 44px 20px; }
  .empty-state svg.big { width: 46px; height: 46px; color: var(--ochre-ink); opacity: .7; margin-bottom: 10px; }
  .empty-state h2 { margin: 0 0 6px; }
  .empty-state p { margin: 0 auto 16px; max-width: 460px; color: var(--ink-soft); font-size: 14px; }
  .empty-state .row-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Emplacements ---------- */
  .locrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px 16px; align-items: start; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .locrow:last-child { border-bottom: none; }
  .locrow .who { min-width: 0; }
  .locrow .who button { background: none; border: none; padding: 0; text-align: left; color: var(--indigo-ink); font-weight: 600; font-size: 13.5px; text-decoration: underline; text-underline-offset: 2px; }
  .locrow .who .chip { margin-bottom: 4px; }
  @media (max-width: 720px) { .locrow { grid-template-columns: 1fr auto; } .locrow .what { grid-column: 1 / -1; order: 3; } }


  /* ---------- Personnes / services ---------- */
  .who-filters { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-bottom: var(--space-3); }
  .who-filters > label { font-size: 11.5px; font-weight: 700; color: var(--card-dim); letter-spacing: .05em; text-transform: uppercase; }
  .who-filters .sel { width: auto; min-width: 180px; max-width: 100%; }
  .people-strip { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 12px 0 0; font-size: 13px; }

<script>
/* ===================================================================
   Module de synchronisation Google Drive — se branche sur la clé
   localStorage existante de l'appli (APP_STORAGE_KEY) au lieu de la
   remplacer. Réutilisable : changer APP_NS pour un autre outil.
   =================================================================== */
(function () {
  'use strict';

  var DRIVE_CLIENT_ID = '1032081391210-5515mnbact7e9t77fssh753330hs5ago.apps.googleusercontent.com';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
  var APP_NS = 'routinecharge';
  var APP_STORAGE_KEY = 'axelRoutineCharge_v1'; /* doit rester identique au STORAGE_KEY du script principal */
  var MODIFIED_KEY = 'gdsync__' + APP_NS + '__modified';
  var CONNECTED_FLAG = 'gdsync__' + APP_NS + '__connected';
  var DOCS_FOLDER_KEY = 'gdsync__' + APP_NS + '__docsFolderId';
  var DOCS_FOLDER_NAME = 'Routine et Charges - Documents';
  var SILENT_REFRESH_MS = 45 * 60 * 1000;

  var tokenClient = null;
  var accessToken = null;
  var tokenExpiresAt = 0;

  function getLocalRecord() {
    var value = null;
    try { value = localStorage.getItem(APP_STORAGE_KEY); } catch (e) { value = null; }
    if (!value) return null;
    var modified = parseInt(localStorage.getItem(MODIFIED_KEY), 10);
    if (!modified) modified = Date.now();
    return { value: value, modified: modified };
  }

  function setLocalRecord(value, modified) {
    try {
      localStorage.setItem(APP_STORAGE_KEY, value);
      localStorage.setItem(MODIFIED_KEY, String(modified));
      return true;
    } catch (e) { return false; }
  }

  function setSyncStatus(mode) {
    var dot = document.getElementById('drive-dot');
    var label = document.getElementById('drive-status-label');
    if (!dot || !label) return;
    dot.className = 'drive-dot' + (mode === 'connected' || mode === 'ok' ? ' is-connected' : mode === 'sync' ? ' is-syncing' : mode === 'error' ? ' is-error' : '');
    var texts = { idle: 'Drive : non connect\u00E9', connected: 'Drive : connect\u00E9', ok: 'Drive : synchronis\u00E9', sync: 'Drive : synchro\u2026', error: 'Drive : erreur' };
    label.textContent = texts[mode] || texts.idle;
  }

  function hasValidToken() { return !!accessToken && Date.now() < tokenExpiresAt - 5000; }

  function driveFetch(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + accessToken;
    return fetch(url, opts).then(function (res) { if (!res.ok) throw new Error('Drive API ' + res.status); return res; });
  }
  function driveFileName() { return 'storage__' + APP_NS + '__state.json'; }
  function driveFindFile() {
    var q = encodeURIComponent("name='" + driveFileName() + "' and trashed=false");
    var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)';
    return driveFetch(url).then(function (res) { return res.json(); }).then(function (data) { return (data.files && data.files[0]) || null; });
  }
  function driveGetRecord(fileId) {
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')
      .then(function (res) { return res.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return null; } });
  }
  /* ---- Pièces jointes : téléversées telles quelles dans un dossier dédié et
     visible du Drive de l'utilisateur (scope drive.file), pour un accès en
     un clic sans alourdir le stockage local du navigateur. ---- */
  function driveFindOrCreateDocsFolder() {
    var cachedId = null;
    try { cachedId = localStorage.getItem(DOCS_FOLDER_KEY); } catch (e) { cachedId = null; }
    if (cachedId) return Promise.resolve(cachedId);
    var q = encodeURIComponent("name='" + DOCS_FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    var url = 'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)';
    return driveFetch(url).then(function (res) { return res.json(); }).then(function (data) {
      if (data.files && data.files[0]) {
        try { localStorage.setItem(DOCS_FOLDER_KEY, data.files[0].id); } catch (e) {}
        return data.files[0].id;
      }
      return driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: DOCS_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
      }).then(function (res) { return res.json(); }).then(function (folder) {
        try { localStorage.setItem(DOCS_FOLDER_KEY, folder.id); } catch (e) {}
        return folder.id;
      });
    });
  }
  function driveUploadRawFile(file, folderId) {
    var boundary = 'gdocbound' + Date.now();
    var metadata = { name: file.name, parents: [folderId] };
    var metadataPart = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n';
    var mediaHeader = '--' + boundary + '\r\nContent-Type: ' + (file.type || 'application/octet-stream') + '\r\n\r\n';
    var closing = '\r\n--' + boundary + '--';
    var body = new Blob([metadataPart, mediaHeader, file, closing]);
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name,size', {
      method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body
    }).then(function (res) { return res.json(); });
  }
  window.__driveHasToken = function () { return hasValidToken(); };
  window.__driveUploadDocument = function (file) {
    if (!hasValidToken()) return Promise.reject(new Error('not-connected'));
    return driveFindOrCreateDocsFolder().then(function (folderId) {
      return driveUploadRawFile(file, folderId).catch(function (err) {
        /* dossier supprimé depuis Drive : on oublie l'id en cache et on réessaie une fois */
        try { localStorage.removeItem(DOCS_FOLDER_KEY); } catch (e) {}
        return driveFindOrCreateDocsFolder().then(function (id2) { return driveUploadRawFile(file, id2); });
      });
    });
  };
  window.__driveDeleteFile = function (fileId) {
    if (!hasValidToken() || !fileId) return Promise.resolve();
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId), { method: 'DELETE' }).catch(function () {});
  };

  function driveCreateFile(record) {
    var boundary = 'gdsyncbound';
    var metadata = { name: driveFileName(), parents: ['appDataFolder'] };
    var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(record) + '\r\n' + '--' + boundary + '--';
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body
    });
  }
  function driveUpdateFile(fileId, record) {
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(record)
    });
  }
  function drivePushRecord(record) {
    return driveFindFile().then(function (existing) { return existing ? driveUpdateFile(existing.id, record) : driveCreateFile(record); });
  }

  async function syncFromDrive(firstConnect) {
    setSyncStatus('sync');
    try {
      var local = getLocalRecord();
      var existing = await driveFindFile();
      if (!existing) {
        if (local) await drivePushRecord(local);
        setSyncStatus('ok');
        return;
      }
      var remote = await driveGetRecord(existing.id);
      if (!remote) { setSyncStatus('ok'); return; }

      if (firstConnect || !local || remote.modified > local.modified) {
        var changed = !(local && local.value === remote.value);
        setLocalRecord(remote.value, remote.modified);
        setSyncStatus('ok');
        if (changed) {
          setSyncStatus('sync');
          setTimeout(function () { location.reload(); }, 700);
        }
      } else if (local.modified > remote.modified) {
        await driveUpdateFile(existing.id, local);
        setSyncStatus('ok');
      } else {
        setSyncStatus('ok');
      }
    } catch (e) {
      setSyncStatus('error');
      console.error('[DriveSync]', e);
    }
  }

  function onTokenReceived(resp) {
    if (resp.error) { setSyncStatus('error'); return; }
    var isFirstConnect = localStorage.getItem(CONNECTED_FLAG) !== '1';
    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in * 1000);
    localStorage.setItem(CONNECTED_FLAG, '1');
    setSyncStatus('connected');
    syncFromDrive(isFirstConnect);
  }

  function initGis() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { setTimeout(initGis, 300); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: onTokenReceived });
    document.getElementById('btn-drive-connect').addEventListener('click', function () {
      tokenClient.requestAccessToken({ prompt: hasValidToken() ? '' : 'consent' });
    });
    document.getElementById('btn-drive-force').addEventListener('click', function () {
      if (!hasValidToken()) { alert('Connecte-toi d\'abord \u00E0 Drive (bouton "Drive : non connect\u00E9").'); return; }
      var local = getLocalRecord();
      if (!local) { alert('Rien en local \u00E0 synchroniser.'); return; }
      setSyncStatus('sync');
      drivePushRecord(local).then(function () {
        setSyncStatus('ok');
        alert('Synchro forc\u00E9e : OK (' + Math.round(local.value.length / 1024) + ' Ko envoy\u00E9s)');
      }).catch(function (e) {
        setSyncStatus('error');
        alert('Erreur : ' + e.message);
      });
    });
    if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' });
    setInterval(function () { if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' }); }, SILENT_REFRESH_MS);
  }
  initGis();

  window.__driveNotifySave = function () {
    var modified = Date.now();
    localStorage.setItem(MODIFIED_KEY, String(modified));
    if (hasValidToken()) {
      var local = getLocalRecord();
      if (!local) return;
      setSyncStatus('sync');
      drivePushRecord(local).then(function () { setSyncStatus('ok'); }).catch(function (e) {
        setSyncStatus('error');
        console.error('[DriveSync] \u00C9chec de la sauvegarde vers Drive :', e);
      });
    }
  };
})();

</script>

/* ======================= Utilitaires ======================= */
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function normText(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
function fold(s) {
  s = String(s == null ? "" : s).toLowerCase();
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) { /* normalize indisponible */ }
  return s;
}
function shorten(s, n) { s = normText(s).replace(/\s+/g, " "); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

/* ---- Dates (format ISO local AAAA-MM-JJ) ---- */
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayISO() { return toISO(new Date()); }
function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function isISO(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var d = parseISO(s);
  return toISO(d) === s;
}
function normDate(v) { return isISO(v) ? v : ""; }
function diffDays(aISO, bISO) { return Math.round((parseISO(aISO) - parseISO(bISO)) / 86400000); }
function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function addMonths(iso, n) {
  var d = parseISO(iso), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return toISO(d);
}
function addInterval(iso, rec) {
  if (rec.unit === "day") return addDays(iso, rec.n);
  if (rec.unit === "week") return addDays(iso, 7 * rec.n);
  return addMonths(iso, rec.n);
}
function fmtDate(iso) { if (!isISO(iso)) return ""; var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function relText(iso) {
  var d = diffDays(iso, todayISO());
  if (d < 0) return "en retard de " + (-d) + " j";
  if (d === 0) return "aujourd’hui";
  if (d === 1) return "demain";
  return "dans " + d + " j";
}
function dueState(iso) {
  if (!iso) return null;
  var d = diffDays(iso, todayISO());
  return d < 0 ? "late" : (d <= SOON_DAYS ? "soon" : "ok");
}

/* ---- Périodicité ---- */
function normRec(r) {
  if (!r || typeof r !== "object") return null;
  var n = parseInt(r.n, 10);
  if (!(n >= 1)) return null;
  if (n > 999) n = 999;
  if (r.unit !== "day" && r.unit !== "week" && r.unit !== "month") return null;
  return { n: n, unit: r.unit };
}
function recLabel(rec) {
  if (!rec) return "";
  var n = rec.n;
  if (rec.unit === "day") return n === 1 ? "Chaque jour" : "Tous les " + n + " jours";
  if (rec.unit === "week") return n === 1 ? "Chaque semaine" : "Toutes les " + n + " semaines";
  if (n === 1) return "Chaque mois";
  if (n === 3) return "Chaque trimestre";
  if (n === 6) return "Chaque semestre";
  if (n === 12) return "Chaque année";
  return "Tous les " + n + " mois";
}
function recPresetKey(rec) {
  if (!rec) return "";
  var k = rec.unit + ":" + rec.n;
  for (var i = 0; i < REC_PRESETS.length; i++) { if (REC_PRESETS[i][0] === k) return k; }
  return "custom";
}
function computeNextDue(c, doneISO) {
  var rec = c.recurrence;
  if (!rec) return "";
  var base = c.nextDue || doneISO;
  var next = addInterval(base, rec), guard = 0;
  while (diffDays(next, doneISO) <= 0 && guard++ < 1000) next = addInterval(next, rec);
  return next;
}

/* ======================= Modèle de données ======================= */
function defaultState() { return { app: "routine-charge", version: 2, theme: "dark", services: [], people: [], charges: [] }; }
function sectionOf(key) { for (var i = 0; i < SECTIONS.length; i++) { if (SECTIONS[i].key === key) return SECTIONS[i]; } return SECTIONS[0]; }
function statusOf(key) { for (var i = 0; i < STATUSES.length; i++) { if (STATUSES[i].key === key) return STATUSES[i]; } return STATUSES[0]; }
function validSection(k) { for (var i = 0; i < SECTIONS.length; i++) { if (SECTIONS[i].key === k) return true; } return false; }
function validStatus(k) { for (var i = 0; i < STATUSES.length; i++) { if (STATUSES[i].key === k) return true; } return false; }
function validType(k) { return k === "action" || k === "note" || k === "titre"; }
function uniqueId(id, prefix, seen) {
  if (!id || seen[id]) id = uid(prefix);
  seen[id] = true;
  return id;
}
function normItem(r, seen) {
  if (!r || typeof r !== "object") return null;
  var type = validType(r.type) ? r.type : "action";
  var it = {
    id: uniqueId(normText(r.id), "i-", seen),
    type: type,
    text: normText(r.text),
    done: false, doneAt: "", dueDate: ""
  };
  if (type === "action") {
    it.done = r.done === true;
    it.doneAt = it.done ? normDate(r.doneAt) : "";
    it.dueDate = normDate(r.dueDate);
  }
  return it;
}
function normLoc(r, seen) {
  if (!r || typeof r !== "object") return null;
  var l = { id: uniqueId(normText(r.id), "l-", seen), context: normText(r.context), label: normText(r.label), path: normText(r.path) };
  return (l.context || l.label || l.path) ? l : null;
}
var NCTX = { services: {}, people: {} };   /* ids valides pendant une normalisation */
function normService(r, seen) {
  if (!r || typeof r !== "object") return null;
  var name = normText(r.name).trim().slice(0, 80);
  return name ? { id: uniqueId(normText(r.id), "s-", seen), name: name } : null;
}
function normPerson(r, seen) {
  if (!r || typeof r !== "object") return null;
  var name = normText(r.name).trim().slice(0, 80);
  if (!name) return null;
  var sid = normText(r.serviceId);
  return { id: uniqueId(normText(r.id), "p-", seen), name: name, serviceId: NCTX.services[sid] ? sid : "" };
}
/* Référence « personne + service » : { person: id, service: id } — ids inconnus écartés. */
function normRef(r) {
  if (!r || typeof r !== "object") return null;
  var p = normText(r.person), s = normText(r.service);
  if (p && !NCTX.people[p]) p = "";
  if (s && !NCTX.services[s]) s = "";
  return (p || s) ? { person: p, service: s } : null;
}
function sameRef(a, b) { return a && b && a.person === b.person && a.service === b.service; }
function normAtt(r, seen) {
  if (!r || typeof r !== "object") return null;
  var a = {
    id: uniqueId(normText(r.id), "a-", seen), name: normText(r.name).trim().slice(0, 200) || "fichier",
    type: normText(r.type).slice(0, 100), size: Math.max(0, Math.round(+r.size || 0)), addedAt: normDate(r.addedAt),
    storage: r.storage === "drive" ? "drive" : "local", driveFileId: "", driveViewLink: "", thumb: "", dataUrl: ""
  };
  var th = normText(r.thumb);
  if (/^data:image\/(jpeg|png|webp|gif);base64,/i.test(th)) a.thumb = th;
  if (a.storage === "drive") {
    a.driveFileId = normText(r.driveFileId).slice(0, 200);
    var lk = normText(r.driveViewLink);
    a.driveViewLink = /^https:\/\/\S+$/i.test(lk) ? lk : (a.driveFileId ? "https://drive.google.com/file/d/" + encodeURIComponent(a.driveFileId) + "/view" : "");
    if (!a.driveFileId && !a.driveViewLink) return null;
  } else {
    var du = normText(r.dataUrl);
    if (!/^data:[^,]*;base64,/i.test(du)) return null;
    if (a.thumb && !/^data:image\//i.test(du)) a.thumb = "";
    a.dataUrl = du;
  }
  return a;
}
function normCharge(r, seen) {
  if (!r || typeof r !== "object") return null;
  var c = {
    id: uniqueId(normText(r.id), "c-", seen),
    section: validSection(r.section) ? r.section : "routine",
    title: normText(r.title),
    note: normText(r.note),
    status: validStatus(r.status) ? r.status : "a_faire",
    dueDate: normDate(r.dueDate),
    closedAt: normDate(r.closedAt),
    recurrence: normRec(r.recurrence),
    nextDue: normDate(r.nextDue),
    lastDone: normDate(r.lastDone),
    origin: normRef(r.origin), owner: normRef(r.owner), linked: [],
    history: [], items: [], locations: [], attachments: []
  };
  if (c.status !== "cloture") c.closedAt = "";
  var i, x;
  var hs = Array.isArray(r.history) ? r.history : [];
  for (i = 0; i < hs.length && c.history.length < HISTORY_MAX; i++) {
    x = hs[i];
    if (x && isISO(x.date)) c.history.push({ date: x.date, done: Math.max(0, parseInt(x.done, 10) || 0), total: Math.max(0, parseInt(x.total, 10) || 0) });
  }
  var its = Array.isArray(r.items) ? r.items : [];
  for (i = 0; i < its.length; i++) { x = normItem(its[i], seen); if (x) c.items.push(x); }
  var ls = Array.isArray(r.locations) ? r.locations : [];
  for (i = 0; i < ls.length; i++) { x = normLoc(ls[i], seen); if (x) c.locations.push(x); }
  var lkd = Array.isArray(r.linked) ? r.linked : [];
  for (i = 0; i < lkd.length && c.linked.length < 50; i++) {
    x = normRef(lkd[i]);
    if (x && !c.linked.some(function (y) { return sameRef(x, y); })) c.linked.push(x);

    if (ranges[i][0] <= last[1]) { if (ranges[i][1] > last[1]) last[1] = ranges[i][1]; } else merged.push(ranges[i]);
  }
  var out = "", pos = 0;
  for (i = 0; i < merged.length; i++) {
    out += esc(text.slice(pos, merged[i][0])) + "<mark>" + esc(text.slice(merged[i][0], merged[i][1])) + "</mark>";
    pos = merged[i][1];
  }
  return out + esc(text.slice(pos));
}

function collectAgenda() {
  var today = todayISO(), horizon = addDays(today, SOON_DAYS), out = [];
  for (var i = 0; i < state.charges.length; i++) {
    var c = state.charges[i], active = c.section === "routine" || c.status !== "cloture";
    if (c.section === "routine") {
      if (c.nextDue && c.nextDue <= horizon) out.push({ date: c.nextDue, kind: "routine", c: c });
    } else if (active && c.dueDate && c.dueDate <= horizon) {
      out.push({ date: c.dueDate, kind: "charge", c: c });
    }
    if (active) {
      for (var j = 0; j < c.items.length; j++) {
        var it = c.items[j];
        if (it.type === "action" && !it.done && it.dueDate && it.dueDate <= horizon) out.push({ date: it.dueDate, kind: "item", c: c, it: it });
      }
    }
  }
  out.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  return out;
}
function renderDashboard() {
  var today = todayISO(), horizon = addDays(today, SOON_DAYS), i;
  var routines = sectionList("routine");
  var others = state.charges.filter(function (c) { return c.section !== "routine"; });
  var rLate = routines.filter(function (c) { return c.nextDue && c.nextDue < today; }).length;
  var rSoon = routines.filter(function (c) { return c.nextDue && c.nextDue >= today && c.nextDue <= horizon; }).length;
  var rNoDate = routines.filter(function (c) { return c.recurrence && !c.nextDue; }).length;
  var inProg = others.filter(function (c) { return c.status === "en_cours"; }).length;
  var late = others.filter(isChargeLate).length;
  var closed = others.filter(function (c) { return c.status === "cloture"; }).length;
  var tot = 0, dn = 0;
  for (i = 0; i < others.length; i++) { var p = progressOf(others[i]); tot += p.total; dn += p.done; }
  var pct = tot ? Math.round(100 * dn / tot) : 0;

  var h = '<div class="dashboard-grid">' +
    statCard("Routines en retard", rLate, "échéance dépassée", "a-brick") +
    statCard("Routines à venir", rSoon, "dans les " + SOON_DAYS + " prochains jours", "") +
    statCard("Actions en cours", inProg, "court, moyen, long terme et idées", "a-indigo") +
    statCard("Échéances dépassées", late, "charges ou actions", "a-brick") +
    statCard("Charges clôturées", closed, "sur " + others.length, "a-moss") +
    statCard("Avancement des actions", pct + " %", dn + " / " + tot + " cochées", "a-teal") + "</div>";

  if (rNoDate) {
    h += '<div class="panel-card" style="padding:12px 16px;"><div class="banner warn" style="margin:0;">' + svg("calendar") + rNoDate + " routine" + (rNoDate > 1 ? "s ont" : " a") + " une périodicité mais pas encore de prochaine échéance. " +
      '<button type="button" class="btn btn-ghost btn-sm" data-act="tab" data-tab="routine">Voir les routines</button></div></div>';
  }

  var agenda = collectAgenda();

function renderResults() {

function renderLocations() {

function render() {

var toastTimer = null;

var modalCtx = null;
function openModal(o) {
  closeModal();
  var prev = document.activeElement;
  var ov = document.createElement("div");
  ov.className = "overlay";
  var box = document.createElement("div");
  box.className = "modal" + (o.cls ? " " + o.cls : "");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-labelledby", "modal-title");
  box.innerHTML = '<div class="modal-head"><h2 id="modal-title">' + esc(o.title) + '</h2><button type="button" class="ibtn" data-modal-close aria-label="Fermer">' + svg("x") + '</button></div><div class="modal-body">' + o.body + '</div><div class="modal-foot"></div>';
  var foot = box.querySelector(".modal-foot");
  (o.buttons || []).forEach(function (b) {
    if (b.spacer) { var sp = document.createElement("span"); sp.className = "spacer"; foot.appendChild(sp); return; }
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn " + (b.kind === "primary" ? "btn-primary" : (b.kind === "danger" ? "btn-danger" : "btn-ghost"));
    btn.textContent = b.label;
    if (b.kind === "primary" || b.kind === "danger") btn.setAttribute("data-primary", "1");
    btn.addEventListener("click", function () {
      var r = b.onClick ? b.onClick(box) : undefined;
      if (r !== false) closeModal();
    });
    foot.appendChild(btn);
  });
  ov.appendChild(box);
  document.body.appendChild(ov);
  modalCtx = { el: ov, box: box, prev: prev };
  box.querySelector("[data-modal-close]").addEventListener("click", closeModal);
  if (o.onOpen) o.onOpen(box);
  var af = box.querySelector("[data-autofocus]") || box.querySelector("input:not([type=hidden]), select, textarea");
  if (af) af.focus();
  return box;
}
function closeModal() {
  if (!modalCtx) return;
  var m = modalCtx;
  modalCtx = null;
  if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
  if (m.prev && m.prev.focus && document.body.contains(m.prev)) { try { m.prev.focus(); } catch (e) { /* ignoré */ } }
}

  }

  }
  openModal({
    title: "Personnes et services", cls: "wide",

    onOpen: function (box) {

      box.addEventListener("input", function (e) {

        }
      });
      box.addEventListener("change", function (e) {
        var t = e.target;
        if (t.classList.contains("tm-ps")) wp[parseInt(t.getAttribute("data-i"), 10)].sKey = t.value;
      });
      box.addEventListener("keydown", function (e) {
        var t = e.target;
        if (e.key === "Enter" && t.classList && (t.classList.contains("tm-s") || t.classList.contains("tm-p"))) {
          e.preventDefault(); e.stopPropagation();                  /* Entrée = ligne suivante (et non « Enregistrer ») */

        else if (act === "del-s") {
          var gone = ws.splice(i, 1)[0];
          for (var k = 0; k < wp.length; k++) { if (wp[k].sKey === gone.key) wp[k].sKey = ""; }
          paint(box, null);

      });
    },

      { label: "Annuler", kind: "ghost" },

        var i, seenS = {}, seenP = {}, nm, f;

        }
        for (i = 0; i < wp.length; i++) {
          nm = wp[i].name.trim(); f = fold(nm);

          if (seenP[f]) { toast("Personne en double : « " + nm + " » (ajoute une initiale pour les distinguer)."); return false; }
          seenP[f] = true;

        for (i = 0; i < wp.length; i++) { if (wp[i].id) keepP[wp[i].id] = true; }
        var goneS = state.services.filter(function (s) { return !keepS[s.id]; });
        var goneP = state.people.filter(function (q) { return !keepP[q.id]; });
        goneS.forEach(function (s) { n = refUsage("service", s.id); if (n) msgs.push("service « " + s.name + " » : retiré de " + n + " référence" + (n > 1 ? "s" : "")); });

        var keyMap = {};
        var newS = ws.map(function (s) { var id = s.id || uid("s-"); keyMap[s.key] = id; return { id: id, name: s.name.trim() }; });
        var newP = wp.map(function (q) { return { id: q.id || uid("p-"), name: q.name.trim(), serviceId: q.sKey && keyMap[q.sKey] ? keyMap[q.sKey] : "" }; });
        goneS.forEach(function (s) { stripRefs("service", s.id); });
        goneP.forEach(function (q) { stripRefs("person", q.id); });
        state.services = newS; state.people = newP;
        commit();
        toast("Personnes et services enregistrés.");
        return true;
      } }
    ]
  });
}

/* ======================= Import / export JSON ======================= */
function exportFileName(suffix) {
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_Routine Charges - " + (suffix ? suffix + " - " : "") + APP_VERSION + ".json";
}
function doExport(suffix) {
  var out = JSON.parse(JSON.stringify(state));
  out.exportedAt = new Date().toISOString();
  var blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = exportFileName(suffix);
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function doImport(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var data;
    try { data = JSON.parse(reader.result); } catch (err) { alert("Impossible de lire ce fichier JSON."); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.charges) || (data.app && data.app !== "routine-charge")) {
      alert("Fichier invalide : ce n’est pas un export de « Routine & Charges ».");
      return;
    }
    if (state.charges.length && !confirm("Importer ce fichier remplacera toutes les données actuelles. Continuer ?")) return;
    var keepS = state.services, keepP = state.people;
    state = normalizeState(data);
    if (!Array.isArray(data.people) && !Array.isArray(data.services)) { state.services = keepS; state.people = keepP; }   /* ancien export : on garde le paramétrage actuel */
    ui.expanded = {}; ui.histOpen = {}; ui.statusFilter = "all"; ui.who = ""; ui.role = "any";
    pruneUI(); saveUI();
    applyTheme(state.theme, false);
    saveState();
    render();
    var na = 0;
    for (var i = 0; i < state.charges.length; i++) na += progressOf(state.charges[i]).total;
    toast("Import réussi : " + state.charges.length + " charges, " + na + " actions.");
  };
  reader.readAsText(file);
}

/* ======================= Thème / navigation ======================= */
function applyTheme(theme, persist) {
  state.theme = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  var btn = $("#btn-theme-toggle");
  if (btn) {
    btn.innerHTML = state.theme === "dark" ? THEME_ICONS.sun : THEME_ICONS.moon;
    var label = state.theme === "dark" ? "Passer en mode clair" : "Passer en mode sombre";
    btn.title = label; btn.setAttribute("aria-label", label);
  }
  if (persist) saveState();
}
function setTab(key) {
  if (TAB_KEYS.indexOf(key) === -1) return;
  clearSearch();
  ui.tab = key; ui.statusFilter = "all";
  saveUI();
  render();
  window.scrollTo(0, 0);
}
function gotoCharge(id) {
  var c = findCharge(id);
  if (!c) return;
  clearSearch();
  ui.tab = c.section; ui.statusFilter = "all"; ui.expanded[id] = true;
  saveUI();
  render();
  var el = document.getElementById("charge-" + id);
  if (el) {
    if (el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 1900);
  }
}
function copyText(text, okMsg) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? okMsg : "Copie impossible : sélectionne le texte manuellement.");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
  } else fallback();
}

/* ======================= Événements ======================= */
var CHANGE_ACTS = { "item-check": 1, "charge-status": 1, "charge-due": 1, "charge-nextdue": 1, "filter-who": 1, "filter-role": 1 };

function handleAct(act, el) {
  var id = el.getAttribute("data-id"), cid = el.getAttribute("data-charge"), iid = el.getAttribute("data-item");
  var c = findCharge(id || cid), it = c && iid ? findItem(c, iid) : null, i;
  switch (act) {
    case "tab": setTab(el.getAttribute("data-tab")); break;
    case "goto": gotoCharge(id); break;
    case "toggle": ui.expanded[id] = !ui.expanded[id]; saveUI(); render(); break;
    case "expand-all": case "collapse-all":
      var lst = ui.tab === "dashboard" || ui.tab === "emplacements" ? [] : sectionList(ui.tab);
      for (i = 0; i < lst.length; i++) { if (act === "expand-all") ui.expanded[lst[i].id] = true; else delete ui.expanded[lst[i].id]; }
      saveUI(); render(); break;
    case "filter-status": ui.statusFilter = el.getAttribute("data-status"); render(); break;
    case "new-charge": openChargeModal(null, el.getAttribute("data-section")); break;
    case "import-empty": $("#file-input").click(); break;
    case "load-seed": restoreSeed(); toast("Données d’origine chargées : " + state.charges.length + " charges."); break;
    case "edit-charge": if (c) openChargeModal(c); break;
    case "delete-charge":
      if (c && confirm("Supprimer la charge « " + shorten(c.title, 80) + " » et tout son contenu ?")) {
        c.attachments.forEach(function (a) { if (a.storage === "drive" && a.driveFileId && typeof window.__driveDeleteFile === "function") window.__driveDeleteFile(a.driveFileId); });
        state.charges = state.charges.filter(function (x) { return x.id !== c.id; });
        delete ui.expanded[c.id]; saveUI(); commit(); toast("Charge supprimée.");
      }
      break;
    case "move-charge": moveCharge(id, parseInt(el.getAttribute("data-dir"), 10)); break;
    case "add-item":
      var row = el.closest(".addrow");
      if (row && c) { addItem(c.id, row.querySelector(".add-item-type").value, row.querySelector(".add-item-input").value); }
      break;
    case "edit-item": if (c && it) openItemModal(c, it); break;
    case "del-item":
      if (c && it && confirm("Supprimer cette ligne ?\n\n« " + shorten(it.text, 120) + " »")) { c.items = c.items.filter(function (x) { return x.id !== it.id; }); commit(); }
      break;
    case "move-item":
      if (c && it) { if (moveInArray(c.items, c.items.indexOf(it), parseInt(el.getAttribute("data-dir"), 10))) commit(); }
      break;
    case "add-att": if (c) { attTarget = c.id; var ai = $("#att-input"); ai.value = ""; ai.click(); } break;
    case "open-att": if (c) openAttachment(c, findAtt(c, el.getAttribute("data-att"))); break;
    case "del-att": if (c) deleteAttachment(c, findAtt(c, el.getAttribute("data-att"))); break;
    case "add-loc": if (c) openLocModal(c, null); break;
    case "edit-loc": var l1 = c && findLoc(c, el.getAttribute("data-loc")); if (l1) openLocModal(c, l1); break;
    case "del-loc":
      var l2 = c && findLoc(c, el.getAttribute("data-loc"));
      if (l2 && confirm("Supprimer cet emplacement ?")) { c.locations = c.locations.filter(function (x) { return x.id !== l2.id; }); commit(); }
      break;
    case "copy-loc":
      var l3 = c && findLoc(c, el.getAttribute("data-loc"));
      if (l3) { if (l3.path) copyText(l3.path, "Chemin copié dans le presse-papiers."); else copyText(l3.label || l3.context, "Texte copié."); }
      break;
    case "finish-cycle": if (c) openCycleModal(c); break;
    case "toggle-history": ui.histOpen[id] = !ui.histOpen[id]; render(); break;
    case "del-history":
      if (c) { var hi = parseInt(el.getAttribute("data-idx"), 10); if (c.history[hi] && confirm("Retirer ce cycle de l’historique ?")) { c.history.splice(hi, 1); commit(); } }
      break;
    case "close-charge": if (c) { setStatus(c, "cloture"); commit(); toast("Charge clôturée."); } break;
    case "reopen-charge": if (c) { setStatus(c, "en_cours"); commit(); toast("Charge rouverte."); } break;
    case "uncheck-all":
      if (c && confirm("Décocher toutes les actions de cette charge ?")) {
        for (i = 0; i < c.items.length; i++) { c.items[i].done = false; c.items[i].doneAt = ""; }
        reopenIfClosed(c); commit();
      }
      break;
  }
}
function handleChange(act, el) {
  var id = el.getAttribute("data-id"), c;
  if (act === "item-check") { toggleItem(el.getAttribute("data-charge"), el.getAttribute("data-item"), el.checked); return; }
  if (act === "filter-who") { ui.who = el.value; ui.role = "any"; render(); return; }
  if (act === "filter-role") { ui.role = el.value; render(); return; }
  c = findCharge(id);
  if (!c) return;
  if (act === "charge-status") { setStatus(c, el.value); commit(); }
  else if (act === "charge-due") { c.dueDate = normDate(el.value); commit(); }
  else if (act === "charge-nextdue") { c.nextDue = normDate(el.value); commit(); }
}

function bindEvents() {
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (CHANGE_ACTS[act]) return;
    handleAct(act, t);
  });
  document.addEventListener("change", function (e) {
    var t = e.target, act = t.getAttribute ? t.getAttribute("data-act") : null;
    if (act && CHANGE_ACTS[act]) handleChange(act, t);
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (e.key === "Escape") {
      if (modalCtx) { closeModal(); return; }
      if (t && t.id === "search" && ui.query) { clearSearch(); render(); return; }
    }
    if (modalCtx) {
      if (e.key === "Enter" && t && t.tagName === "INPUT" && t.type !== "checkbox" && t.type !== "radio") {
        var pb = modalCtx.box.querySelector("[data-primary]");
        if (pb) { e.preventDefault(); pb.click(); }
      }
      if (e.key === "Tab") {
        var f = modalCtx.box.querySelectorAll("button, input, select, textarea");
        var list = [];
        for (var i = 0; i < f.length; i++) { if (!f[i].disabled && f[i].offsetParent !== null) list.push(f[i]); }
        if (list.length) {
          var first = list[0], last = list[list.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
      return;
    }
    if (e.key === "Enter" && t && t.classList && t.classList.contains("add-item-input")) {
      e.preventDefault();
      var row = t.closest(".addrow");
      addItem(t.getAttribute("data-charge"), row.querySelector(".add-item-type").value, t.value);
      return;
    }
    if (e.key === "/" && t && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { e.preventDefault(); $("#search").focus(); }
  });
  $("#search").addEventListener("input", function () { setQuery(this.value); render(); });
  $("#search-clear").addEventListener("click", function () { clearSearch(); render(); $("#search").focus(); });
  $("#btn-export").addEventListener("click", function () { doExport(); });
  $("#btn-reset").addEventListener("click", openResetModal);
  $("#btn-team").addEventListener("click", openTeamModal);
  $("#att-input").addEventListener("change", function () {
    var files = this.files, cid = attTarget;
    if (files && files.length && cid) addFiles(cid, files);
    this.value = "";
  });
  $("#btn-theme-toggle").addEventListener("click", function () { applyTheme(state.theme === "dark" ? "light" : "dark", true); });
  $("#file-input").addEventListener("change", function () {
    if (this.files && this.files[0]) doImport(this.files[0]);
    this.value = "";
  });
  /* Autre onglet du navigateur qui modifie les données : on recharge l'état. */
  window.addEventListener("storage", function (e) {
    if (e.key !== STORAGE_KEY) return;
    loadState(); pruneUI(); applyTheme(state.theme, false); render();
  });
}

/* ======================= Démarrage ======================= */
function init() {
  loadState();
  loadUI();
  pruneUI();
  $("#search-clear").innerHTML = svg("x");
  applyTheme(state.theme, false);
  bindEvents();
  render();
}
init();

})();
</script>
</body>
</html>
