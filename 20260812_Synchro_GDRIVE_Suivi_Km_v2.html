<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Politique de sécurité (CSP) : tout est interdit par défaut. Seuls sont autorisés
  le code inline de l'outil et, parce que l'outil est synchronisé Google Drive,
  les adresses Google strictement nécessaires :
   - accounts.google.com/gsi/ : bibliothèque d'authentification Google (script, style, iframe, appels) ;
   - www.googleapis.com       : API Drive (lecture/écriture du fichier de l'outil dans appDataFolder).
  Aucune autre destination réseau n'est joignable, même par du code injecté via un fichier piégé.
  Les images (photos des véhicules) ne sont acceptées qu'en data: (stockées dans les données).
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'unsafe-inline' https://accounts.google.com/gsi/style; img-src data: blob:; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Suivi Kilométrique</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* =====================================================================
     Charte visuelle commune (référence : outil Workshop)
     ===================================================================== */
  :root{
    --bg:#f2f4f8; --surface:#ffffff; --surface-alt:#f7f8fb; --border:#dde2ea;
    --ink:#1a2233; --ink-muted:#647089;
    --primary:#2955a3; --primary-dark:#1f4280; --primary-tint:#e7edf8;
    --accent:#b8860b; --accent-tint:#faf3e0;
    --ok:#1f8a4c; --ok-bg:#e3f6ea; --warn:#b3760a; --warn-bg:#fbf1dc; --danger:#c0392b; --danger-bg:#fbe6e3;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 1px 2px rgba(20,30,50,.05);
    --shadow-hover:0 10px 24px rgba(20,30,50,.12);
    --radius:12px; --radius-sm:8px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#0f141c; --surface:#171e28; --surface-alt:#1d2531; --border:#2b3444;
    --ink:#e7ebf3; --ink-muted:#8e9ab0;
    --primary:#6f9ceb; --primary-dark:#8fb4f0; --primary-tint:#1c2940;
    --accent:#e0b04a; --accent-tint:#332a14;
    --ok:#4bcf87; --ok-bg:#123321; --warn:#e0b04a; --warn-bg:#332a14; --danger:#e2685d; --danger-bg:#3a1c1a;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --shadow-hover:0 10px 26px rgba(0,0,0,.45);
    color-scheme:dark; /* calendriers et listes natives en sombre */
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink); padding:18px; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  .container{ max-width:1880px; margin:0 auto; }
  input[type=file]{ display:none; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---- En-tête ---- */
  .app-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .app-header h1{ margin:0 0 4px; font-size:24px; font-weight:800; letter-spacing:-0.01em; }
  .subtitle{ margin:0; color:var(--ink-muted); font-size:13.5px; }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---- Boutons ---- */
  .btn-primary{ background:var(--primary); color:#fff; border:none; padding:10px 16px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--border); padding:9px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; }
  .btn-secondary:hover{ background:var(--surface-alt); }
  .btn-outline-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); padding:9px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-outline-danger:hover{ background:var(--danger-bg); }
  .btn-danger{ background:var(--danger); color:#fff; border:none; padding:10px 16px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; cursor:pointer; }
  .btn-danger:hover{ filter:brightness(.9); }
  .btn-icon{ background:var(--surface); border:1px solid var(--border); color:var(--ink); width:36px; height:36px; border-radius:var(--radius-sm); cursor:pointer; font-size:16px; display:inline-flex; align-items:center; justify-content:center; }
  .btn-icon:hover{ background:var(--surface-alt); }
  .btn-tiny{ background:var(--surface-alt); border:1px solid var(--border); color:var(--ink); padding:4px 9px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-tiny:hover{ background:var(--primary-tint); }
  .btn-tiny.danger{ color:var(--danger); }
  .btn-tiny.danger:hover{ background:var(--danger-bg); }
  /* Variante propre à l'outil : validation d'un entretien */
  .btn-tiny.ok{ color:var(--ok); border-color:var(--ok); }
  .btn-tiny.ok:hover{ background:var(--ok-bg); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  /* ---- Bouton Drive (module de synchro) ---- */
  .drive-btn{ display:inline-flex; align-items:center; gap:7px; }
  .drive-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--ink-muted); transition:background .2s ease; }
  .drive-dot.is-connected{ background:var(--ok); }
  .drive-dot.is-syncing{ background:var(--warn); animation:drive-pulse 1s ease-in-out infinite; }
  .drive-dot.is-error{ background:var(--danger); }
  @keyframes drive-pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---- Barre de sélection du véhicule ---- */
  .veh-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .veh-bar-label{ font-size:11.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; }
  .veh-bar select{ min-width:260px; }
  .veh-bar-empty{ color:var(--ink-muted); font-size:13px; }
  .veh-avatar, .veh-avatar-placeholder{ width:34px; height:34px; border-radius:var(--radius-sm); border:1px solid var(--border); flex-shrink:0; }
  .veh-avatar{ object-fit:cover; }
  .veh-avatar-placeholder{ background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:16px; }

  /* ---- Onglets ---- */
  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tab{ padding:10px 18px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; }
  .tab:hover{ background:var(--surface-alt); }
  .tab.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* ---- Cartes ---- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px; min-width:0; }
  .card-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .card-header h3{ margin:0; font-size:15px; font-weight:800; }
  .card-sub{ margin:2px 0 0; font-size:12.5px; color:var(--ink-muted); }

  /* ---- Mises en page en grille (occupation de la largeur d'écran) ---- */
  .dash-top{ display:grid; grid-template-columns:minmax(300px, 1fr) minmax(0, 2fr); gap:18px; margin-bottom:18px; }
  .dash-top > .card{ margin-bottom:0; }
  .dash-grid{ display:grid; grid-template-columns:minmax(0, 1.65fr) minmax(340px, 1fr); gap:18px; align-items:start; }
  .split-grid{ display:grid; grid-template-columns:minmax(320px, 460px) minmax(0, 1fr); gap:18px; align-items:start; }
  @media (max-width:1100px){ .dash-top, .dash-grid, .split-grid{ grid-template-columns:1fr; } }

  /* ---- Formulaires ---- */
  select, input[type=text], input[type=date], input[type=number], textarea{
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    padding:8px 10px; border-radius:var(--radius-sm); font-size:13.5px;
  }
  textarea{ resize:vertical; min-height:64px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; min-width:0; }
  .field > label{ font-size:12.5px; font-weight:700; color:var(--ink-muted); }
  .field .req{ color:var(--danger); }
  .field-hint{ font-weight:400; font-size:12px; color:var(--ink-muted); }
  /* largeur pleine limitée aux champs de formulaire (évite d'écraser d'autres règles de largeur) */
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{ width:100%; }
  .check-label{ display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; margin-bottom:12px; }
  .check-label input{ width:16px; height:16px; accent-color:var(--primary); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .form-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px; }
  .is-dimmed{ opacity:.45; }
  @media (max-width:720px){ .form-grid, .form-grid-3{ grid-template-columns:1fr; } }
  .form-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }

  /* ---- Indicateurs ---- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; }
  @media (max-width:800px){ .kpi-grid{ grid-template-columns:1fr 1fr; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; display:flex; flex-direction:column; justify-content:center; }
  .kpi-label{ font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px; }
  .kpi-value{ font-size:24px; font-weight:800; color:var(--primary); line-height:1.1; font-variant-numeric:tabular-nums; }
  .kpi-sub{ font-size:12px; color:var(--ink-muted); margin-top:5px; }

  /* ---- Carte d'identité du véhicule ---- */
  .veh-hero{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .veh-hero-photo, .veh-hero-photo-placeholder{ width:104px; height:104px; border-radius:var(--radius); border:1px solid var(--border); flex-shrink:0; }
  .veh-hero-photo{ object-fit:cover; }
  .veh-hero-photo-placeholder{ background:var(--surface-alt); border-style:dashed; display:flex; align-items:center; justify-content:center; font-size:36px; color:var(--ink-muted); }
  .veh-hero-info{ min-width:0; }
  .veh-hero-info h2{ margin:0 0 3px; font-size:20px; font-weight:800; overflow-wrap:anywhere; }
  .veh-hero-model{ color:var(--ink-muted); font-size:13px; }
  .veh-hero-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink); white-space:nowrap; }
  .chip-accent{ color:var(--primary); border-color:var(--primary-tint); background:var(--primary-tint); }

  /* ---- Cartes véhicules (onglet Véhicules) ---- */
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .veh-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; cursor:pointer; position:relative; transition:box-shadow .15s ease, border-color .15s ease; }
  .veh-card:hover{ box-shadow:var(--shadow-hover); border-color:var(--primary); }
  .veh-card.is-active{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-tint) inset, var(--shadow); }
  .veh-card-top{ display:flex; gap:12px; align-items:center; margin-bottom:10px; padding-right:52px; }
  .veh-card-photo, .veh-card-photo-placeholder{ width:52px; height:52px; border-radius:var(--radius-sm); border:1px solid var(--border); flex-shrink:0; }
  .veh-card-photo{ object-fit:cover; }
  .veh-card-photo-placeholder{ background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .veh-card-name{ font-size:14.5px; font-weight:800; overflow-wrap:anywhere; }
  .veh-card-plate, .veh-card-last{ font-size:12.5px; color:var(--ink-muted); }
  .veh-card-actions{ display:flex; gap:8px; margin-top:12px; }
  .active-badge{ position:absolute; top:12px; right:12px; background:var(--primary); color:#fff; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }

  /* ---- Photo ---- */
  .img-upload-zone{ border:2px dashed var(--border); border-radius:var(--radius-sm); padding:16px; text-align:center; cursor:pointer; background:var(--surface-alt); }
  .img-upload-zone:hover{ border-color:var(--primary); background:var(--primary-tint); }
  .img-upload-zone p{ font-size:12.5px; color:var(--ink-muted); margin:6px 0 0; }
  .img-preview{ margin-top:10px; display:flex; align-items:center; gap:10px; }
  .img-preview:empty{ display:none; }
  .img-preview img{ max-width:90px; max-height:90px; border-radius:var(--radius-sm); border:1px solid var(--border); object-fit:cover; }

  /* ---- Tableaux ---- */
  .table-wrap{ overflow:auto; max-height:640px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
  table.data-table{ width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px; }
  table.data-table thead th{ position:sticky; top:0; z-index:1; background:var(--surface-alt); color:var(--ink-muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; text-align:left; padding:10px; border-bottom:1px solid var(--border); }
  table.data-table tbody td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; overflow-wrap:anywhere; }
  table.data-table tbody tr:last-child td{ border-bottom:none; }
  table.data-table tbody tr:hover td{ background:var(--surface-alt); }
  table.data-table th.right, table.data-table td.right{ text-align:right; }
  .td-num{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .td-delta{ color:var(--ink-muted); font-size:12.5px; }
  .td-delta.neg{ color:var(--danger); font-weight:700; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }

  /* ---- Badges de statut ---- */
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:800; white-space:nowrap; }
  .badge-overdue{ background:var(--danger-bg); color:var(--danger); }
  .badge-soon{ background:var(--warn-bg); color:var(--warn); }
  .badge-ok{ background:var(--ok-bg); color:var(--ok); }
  .badge-done{ background:var(--surface-alt); color:var(--ink-muted); border:1px solid var(--border); }

  /* ---- Cartes d'entretien ---- */
  .maint-card{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; margin-bottom:10px; }
  .maint-card:last-child{ margin-bottom:0; }
  .maint-card.overdue{ border-left-color:var(--danger); background:var(--danger-bg); }
  .maint-card.soon{ border-left-color:var(--warn); background:var(--warn-bg); }
  .maint-card.ok{ border-left-color:var(--ok); }
  .maint-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .maint-title{ font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:8px; overflow-wrap:anywhere; }
  .maint-cat-icon{ font-size:16px; }
  .maint-sub{ font-size:12px; color:var(--ink-muted); }
  .maint-meta{ display:flex; flex-direction:column; gap:3px; margin:8px 0 2px; font-size:12.5px; color:var(--ink-muted); }
  .maint-meta b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .maint-due{ font-weight:700; }
  .maint-due.overdue{ color:var(--danger); }
  .maint-due.soon{ color:var(--warn); }
  .maint-notes{ font-size:12.5px; color:var(--ink-muted); margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .maint-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .maint-history{ margin-top:10px; padding-top:8px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); }
  .maint-history-item{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .next-maint-note{ margin:12px 0 0; font-size:12px; color:var(--ink-muted); }

  /* ---- Graphique réel vs théorique ---- */
  .theory-config{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px; background:var(--surface-alt); border-radius:var(--radius-sm); border:1px solid var(--border); }
  .theory-config .field{ margin-bottom:0; min-width:160px; flex:1; }
  .chart-svg{ width:100%; height:auto; display:block; }
  .chart-legend{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
  .legend-swatch{ width:18px; height:3px; border-radius:2px; }
  .legend-swatch.dashed{ background-image:linear-gradient(90deg, var(--ink-muted) 60%, transparent 40%); background-size:8px 3px; }
  .gap-banner{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--radius-sm); margin-top:14px; font-size:13.5px; font-weight:700; }
  .gap-banner.pos{ background:var(--ok-bg); color:var(--ok); }
  .gap-banner.neg{ background:var(--danger-bg); color:var(--danger); }

  /* ---- États vides ---- */
  .empty-state{ text-align:center; padding:42px 20px; color:var(--ink-muted); }
  .empty-state .icon{ font-size:36px; margin-bottom:10px; }
  .empty-state p{ font-size:14px; margin:0 0 14px; line-height:1.5; }
  .empty-inline{ color:var(--ink-muted); font-size:13.5px; padding:6px 0; }

  /* ---- Modales ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,14,22,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000; }
  #confirm-root .modal-overlay{ z-index:1100; }
  .modal{ background:var(--surface); border-radius:var(--radius); max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-hover); }
  .modal-small{ max-width:420px; }
  .modal-wide{ max-width:640px; }
  .modal-guide{ max-width:780px; }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-header h2{ margin:0; font-size:16.5px; font-weight:800; }
  .close-btn{ background:none; border:none; font-size:20px; color:var(--ink-muted); cursor:pointer; line-height:1; padding:4px; }
  .close-btn:hover{ color:var(--ink); }
  .modal-body{ padding:18px 22px 22px; }
  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .modal-hint{ background:var(--primary-tint); color:var(--primary-dark); border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600; margin-bottom:12px; }
  .modal-hint.warn{ background:var(--warn-bg); color:var(--warn); }
  .confirm-message{ font-size:13.5px; line-height:1.55; white-space:pre-wrap; margin:0; }
  .import-list{ margin:6px 0 12px; padding-left:20px; font-size:13px; line-height:1.5; }
  .radio-line{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:8px; cursor:pointer; }

  /* ---- Mode d'emploi ---- */
  .help-toc{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .help-body h3{ font-size:15px; margin:20px 0 6px; scroll-margin-top:10px; }
  .help-body h3:first-of-type{ margin-top:0; }
  .help-body p, .help-body li{ font-size:13px; line-height:1.55; }
  .help-body ul{ padding-left:20px; margin:6px 0 10px; }

  /* ---- Toasts ---- */
  #toastContainer{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast{ background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); animation:toastIn .2s ease forwards; max-width:min(92vw, 640px); }
  .toast.toast-error{ background:var(--danger); color:#fff; }
  .toast.toast-success{ background:var(--ok); color:#fff; }
  .toast.toast-warning{ background:var(--warn); color:#fff; }
  @keyframes toastIn{ to{ opacity:1; transform:translateY(0); } }

  @media (max-width:720px){
    body{ padding:14px; }
    .veh-bar select{ min-width:0; width:100%; }
  }

  /* =====================================================================
     Impression / PDF : zone dédiée #printArea, remplie juste avant

<script>
/* ===================================================================
   Module de synchronisation Google Drive — se branche sur la clé
   localStorage existante de l'appli (APP_STORAGE_KEY).
   =================================================================== */
(function () {
  'use strict';

  var DRIVE_CLIENT_ID = '1032081391210-5515mnbact7e9t77fssh753330hs5ago.apps.googleusercontent.com';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var APP_NS = 'kmtrack';
  var APP_STORAGE_KEY = 'kmTrackerData_v1';
  var MODIFIED_KEY = 'gdsync__' + APP_NS + '__modified';
  var CONNECTED_FLAG = 'gdsync__' + APP_NS + '__connected';
  var SILENT_REFRESH_MS = 45 * 60 * 1000;

  var tokenClient = null;
  var accessToken = null;
  var tokenExpiresAt = 0;

  function getLocalRecord() {
    var value = null;
    try { value = localStorage.getItem(APP_STORAGE_KEY); } catch (e) { value = null; }
    if (!value) return null;
    var modified = parseInt(localStorage.getItem(MODIFIED_KEY), 10);
    if (!modified) modified = Date.now();
    return { value: value, modified: modified };
  }
  function setLocalRecord(value, modified) {
    try {
      localStorage.setItem(APP_STORAGE_KEY, value);
      localStorage.setItem(MODIFIED_KEY, String(modified));
      return true;
    } catch (e) { return false; }
  }
  function setSyncStatus(mode) {
    var dot = document.getElementById('drive-dot');
    var label = document.getElementById('drive-status-label');
    if (!dot || !label) return;
    dot.className = 'drive-dot' + (mode === 'connected' || mode === 'ok' ? ' is-connected' : mode === 'sync' ? ' is-syncing' : mode === 'error' ? ' is-error' : '');
    var texts = { idle: 'Drive : non connecté', connected: 'Drive : connecté', ok: 'Drive : synchronisé', sync: 'Drive : synchro…', error: 'Drive : erreur' };
    label.textContent = texts[mode] || texts.idle;
  }
  function hasValidToken() { return !!accessToken && Date.now() < tokenExpiresAt - 5000; }
  function driveFetch(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + accessToken;
    return fetch(url, opts).then(function (res) { if (!res.ok) throw new Error('Drive API ' + res.status); return res; });
  }
  function driveFileName() { return 'storage__' + APP_NS + '__state.json'; }
  function driveFindFile() {
    var q = encodeURIComponent("name='" + driveFileName() + "' and trashed=false");
    var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)';
    return driveFetch(url).then(function (res) { return res.json(); }).then(function (data) { return (data.files && data.files[0]) || null; });
  }
  function driveGetRecord(fileId) {
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')
      .then(function (res) { return res.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return null; } });
  }
  function driveCreateFile(record) {
    var boundary = 'gdsyncbound';
    var metadata = { name: driveFileName(), parents: ['appDataFolder'] };
    var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(record) + '\r\n' + '--' + boundary + '--';
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body
    });
  }
  function driveUpdateFile(fileId, record) {
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(record)
    });
  }
  function drivePushRecord(record) {
    return driveFindFile().then(function (existing) { return existing ? driveUpdateFile(existing.id, record) : driveCreateFile(record); });
  }
  function syncFromDrive(firstConnect) {
    setSyncStatus('sync');
    var local = getLocalRecord();
    driveFindFile().then(function (existing) {
      if (!existing) {
        if (local) return drivePushRecord(local).then(function () { setSyncStatus('ok'); });
        setSyncStatus('ok');
        return;
      }
      return driveGetRecord(existing.id).then(function (remote) {
        if (!remote) { setSyncStatus('ok'); return; }
        if (firstConnect || !local || remote.modified > local.modified) {
          var changed = !(local && local.value === remote.value);
          setLocalRecord(remote.value, remote.modified);
          setSyncStatus('ok');
          if (changed) {
            setSyncStatus('sync');
            setTimeout(function () { location.reload(); }, 700);
          }
        } else if (local.modified > remote.modified) {
          return driveUpdateFile(existing.id, local).then(function () { setSyncStatus('ok'); });
        } else {
          setSyncStatus('ok');
        }
      });
    }).catch(function (e) {
      setSyncStatus('error');
      console.error('[DriveSync]', e);
    });
  }
  function onTokenReceived(resp) {
    if (resp.error) { setSyncStatus('error'); return; }
    var isFirstConnect = localStorage.getItem(CONNECTED_FLAG) !== '1';
    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + (resp.expires_in * 1000);
    localStorage.setItem(CONNECTED_FLAG, '1');
    setSyncStatus('connected');
    syncFromDrive(isFirstConnect);
  }
  function initGis() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { setTimeout(initGis, 300); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: onTokenReceived });
    document.getElementById('btn-drive-connect').addEventListener('click', function () {
      tokenClient.requestAccessToken({ prompt: hasValidToken() ? '' : 'consent' });
    });
    document.getElementById('btn-drive-force').addEventListener('click', function () {
      if (!hasValidToken()) { alert('Connecte-toi d\'abord à Drive (bouton "Drive : non connecté").'); return; }
      var local = getLocalRecord();
      if (!local) { alert('Rien en local à synchroniser.'); return; }
      setSyncStatus('sync');
      drivePushRecord(local).then(function () {
        setSyncStatus('ok');
        alert('Synchro forcée : OK (' + Math.round(local.value.length / 1024) + ' Ko envoyés)');
      }).catch(function (e) {
        setSyncStatus('error');
        alert('Erreur : ' + e.message);
      });
    });
    if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' });
    setInterval(function () { if (localStorage.getItem(CONNECTED_FLAG) === '1') tokenClient.requestAccessToken({ prompt: '' }); }, SILENT_REFRESH_MS);
  }
  initGis();

  window.__driveNotifySave = function () {
    var modified = Date.now();
    localStorage.setItem(MODIFIED_KEY, String(modified));
    if (hasValidToken()) {
      var local = getLocalRecord();
      if (!local) return;
      setSyncStatus('sync');
      drivePushRecord(local).then(function () { setSyncStatus('ok'); }).catch(function (e) {
        setSyncStatus('error');
        console.error('[DriveSync] Échec de la sauvegarde vers Drive :', e);
      });
    }
  };
})();
</script>
<script>
/* =======================================================================
   SUIVI KILOMÉTRIQUE — logique applicative
   -----------------------------------------------------------------------
   Organisation du script :
     1. Constantes et trame HTML vierge
     2. Utilitaires (dates, nombres, échappement, contrôle des données importées)
     3. État : chargement, normalisation/migration, sauvegarde (change-gated)
     4. Calculs : statistiques mensuelles, théorie, statut et échéance des entretiens
     5. Interface commune : toasts, modales, confirmation, photos
     6. Rendu : barre véhicule, onglets, tableau de bord, graphique, kilométrage,
        entretiens, véhicules
     7. Import / Export JSON
     8. Copie locale (dossier, API File System Access)
     9. Impression PDF
    10. Mode d'emploi
    11. Thème et initialisation
   Persistance : localStorage (clé STORAGE_KEY) = source de vérité locale,
   synchronisée avec Google Drive par le module précédent (window.__driveNotifySave).
   ======================================================================= */
(function () {
'use strict';

/* =====================================================================
   1. CONSTANTES
   ===================================================================== */
var APP_NS = 'kmtrack';                // identifiant de l'outil (champ « app » des fichiers JSON, = APP_NS du module Drive)
var STORAGE_KEY = 'kmTrackerData_v1';  // = APP_STORAGE_KEY du module Drive : ne pas changer (données existantes)
var THEME_KEY = 'kmtrack_theme';       // préférence propre au poste, jamais écrite dans les fichiers
var SCHEMA_VERSION = 1;                // version du format de données (state.version / champ « version » des fichiers)
var TOOL_VERSION = 'v2';               // version du fichier outil : à incrémenter à chaque livraison (nom de la trame HTML)
var FILE_PREFIX = 'Suivi_Km';          // préfixe des copies locales et de la trame
var NEXT_MAINT_COUNT = 3;              // nombre minimal d'entretiens affichés dans « Prochains entretiens »
var DAYS_PER_MONTH = 30.4368;          // durée moyenne d'un mois (365,2425 / 12)

var COLORS = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
var CATS = [
  { id: 'revision', label: 'Révision', icon: '🔧' },
  { id: 'vidange', label: 'Vidange', icon: '🛢️' },
  { id: 'pneus', label: 'Pneus', icon: '🛞' },
  { id: 'freins', label: 'Freins', icon: '🛑' },
  { id: 'courroie', label: 'Courroie de distribution', icon: '⚙️' },
  { id: 'batterie', label: 'Batterie', icon: '🔋' },
  { id: 'ct', label: 'Contrôle technique', icon: '✅' },
  { id: 'autre', label: 'Autre', icon: '📌' }
];
var FUELS = ['Essence', 'Diesel', 'Électrique', 'Hybride', 'GPL', 'Autre'];
var MONTH_NAMES = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
var MONTH_LONG = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* Trame HTML vierge de l'outil, capturée avant tout rendu de données :
   écrite par la Copie locale dans le dossier (une fois par version). */
var pristineHtmlTemplate = null;
try { pristineHtmlTemplate = '<!DOCTYPE html>\n' + document.documentElement.outerHTML; } catch (e) { pristineHtmlTemplate = null; }

var state = null;            // données en mémoire (voir blankState)
var activeTab = 'dashboard'; // onglet affiché
var lastSavedSignature = null; // sérialisation de la dernière écriture (évite les écritures sans changement réel)

/* =====================================================================
   2. UTILITAIRES
   ===================================================================== */
function $(id) { return document.getElementById(id); }
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function startOfToday() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseISO(s) { if (!s) return null; var p = s.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function formatDateFR(s) { var d = parseISO(s); if (!d || isNaN(d.getTime())) return '—'; return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear(); }
function formatDateObjFR(d) { return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear(); }
function formatNum(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return Math.round(n).toLocaleString('fr-FR'); }
function formatNum1(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return n.toLocaleString('fr-FR', { maximumFractionDigits: 1 }); }
function daysBetween(d1, d2) { return Math.round((d2.getTime() - d1.getTime()) / 86400000); }
function monthsBetweenDec(d1, d2) { return (d2.getTime() - d1.getTime()) / 86400000 / DAYS_PER_MONTH; }
function addMonthsToDate(d, months) {
  var res = new Date(d.getTime());
  var totalMonths = res.getMonth() + months;
  res.setMonth(totalMonths);
  return res;
}
function ageString(fromISO) {
  if (!fromISO) return null;
  var start = parseISO(fromISO), now = new Date();
  if (start > now) return null;
  var months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() < start.getDate()) months--;
  if (months < 0) months = 0;
  var years = Math.floor(months / 12);
  var rem = months % 12;
  var parts = [];
  if (years > 0) parts.push(years + ' an' + (years > 1 ? 's' : ''));
  parts.push(rem + ' mois');
  return parts.join(', ');
}
function findById(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function catById(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i]; return CATS[CATS.length - 1]; }

/* Échappement HTML : TOUT texte issu des données passe par escapeHtml avant
   d'être inséré dans du HTML (contenu ou attribut), y compris les identifiants. */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Contrôle des valeurs lues (localStorage, Drive ou fichier importé) : un
   fichier piégé ne doit pas pouvoir injecter de HTML/CSS via les champs
   insérés tels quels (photo en src, couleur en style, identifiants…). */
function isISODate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseISO(s).getTime()); }
function toNumOrNull(x) { if (x === '' || x === null || x === undefined || typeof x === 'boolean') return null; var n = Number(x); return isFinite(n) ? n : null; }
function str(x) { return (x === null || x === undefined || typeof x === 'object') ? '' : String(x); }
function safeId(x, prefix) { return (typeof x === 'string' && /^[A-Za-z0-9_\-]{1,64}$/.test(x)) ? x : uid(prefix); }
function safeColor(c) { return (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : null; }
function safePhoto(p) { return (typeof p === 'string' && /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(p)) ? p : null; }

/* =====================================================================
   3. ÉTAT
   ===================================================================== */
function blankState() {
  return { version: SCHEMA_VERSION, vehicles: [], activeVehicleId: null, meta: { modified: Date.now() } };
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return blankState();
    return migrateState(JSON.parse(raw));
  } catch (e) { return blankState(); }
}
/* Point d'entrée unique des migrations (chargement local, Drive et import).
   Format v1 = format actuel : seule la normalisation s'applique. Une future
   évolution de structure ajoutera ici sa conversion « if (version < N) ». */
function migrateState(parsed) {
  return normalizeState(parsed);
}
function normalizeState(parsed) {
  var s = blankState();
  if (!parsed || typeof parsed !== 'object') return s;
  s.vehicles = Array.isArray(parsed.vehicles) ? parsed.vehicles.filter(function (v) { return v && typeof v === 'object'; }).map(normalizeVehicle) : [];
  s.activeVehicleId = (typeof parsed.activeVehicleId === 'string' && findById(s.vehicles, parsed.activeVehicleId)) ? parsed.activeVehicleId : (s.vehicles[0] ? s.vehicles[0].id : null);
  s.meta = { modified: (parsed.meta && toNumOrNull(parsed.meta.modified)) || Date.now() };
  return s;
}
function normalizeVehicle(v) {
  v = v || {};
  var theo = toNumOrNull(v.theoreticalKmPerMonth);
  return {
    id: safeId(v.id, 'veh'),
    name: str(v.name) || 'Véhicule',
    brand: str(v.brand),
    model: str(v.model),
    plate: str(v.plate),
    firstRegistration: isISODate(v.firstRegistration) ? v.firstRegistration : '',
    purchaseDate: isISODate(v.purchaseDate) ? v.purchaseDate : '',
    purchaseKm: toNumOrNull(v.purchaseKm),
    fuelType: str(v.fuelType),
    color: safeColor(v.color) || COLORS[0],
    photo: safePhoto(v.photo),
    // absent → 1000 km/mois par défaut (comme en v1) ; vide ou invalide → 0
    theoreticalKmPerMonth: (v.theoreticalKmPerMonth === undefined || v.theoreticalKmPerMonth === null) ? 1000 : (theo === null ? 0 : theo),
    theoreticalStartDate: isISODate(v.theoreticalStartDate) ? v.theoreticalStartDate : '',
    theoreticalStartKm: toNumOrNull(v.theoreticalStartKm),
    notes: str(v.notes),
    readings: Array.isArray(v.readings) ? v.readings.filter(function (r) { return r && typeof r === 'object'; }).map(function (r) {
      return { id: safeId(r.id, 'rd'), date: isISODate(r.date) ? r.date : todayISO(), km: Number(r.km) || 0, notes: str(r.notes) };
    }) : [],
    maintenances: Array.isArray(v.maintenances) ? v.maintenances.filter(function (m) { return m && typeof m === 'object'; }).map(normalizeMaintenance) : []
  };
}
function normalizeMaintenance(m) {
  m = m || {};
  return {
    id: safeId(m.id, 'mt'),
    category: findCatStrict(m.category) ? m.category : 'autre',
    label: str(m.label),
    targetDate: isISODate(m.targetDate) ? m.targetDate : '',
    targetKm: toNumOrNull(m.targetKm),
    recurring: !!m.recurring,
    recurrenceMonths: toNumOrNull(m.recurrenceMonths),
    recurrenceKm: toNumOrNull(m.recurrenceKm),
    notes: str(m.notes),
    history: Array.isArray(m.history) ? m.history.filter(function (h) { return h && typeof h === 'object'; }).map(function (h) {
      return { date: isISODate(h.date) ? h.date : '', km: toNumOrNull(h.km), notes: str(h.notes) };
    }) : []
  };
}
function findCatStrict(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return true; return false; }

/* Signature des données métier (sans meta.modified, qui change à chaque écriture). */
function stateSignature(s) {
  return JSON.stringify({ version: s.version, vehicles: s.vehicles, activeVehicleId: s.activeVehicleId });
}
/* Écrit dans localStorage UNIQUEMENT si les données ont réellement changé,
   puis prévient le module Drive. Écrire sans changement provoquerait des
   boucles de synchro et des brouillons fantômes. Renvoie true si écrit. */
function saveState() {
  var sig = stateSignature(state);
  if (sig === lastSavedSignature) return false;
  state.meta.modified = Date.now();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { showToast('Erreur de sauvegarde locale (stockage plein ?)', 'error'); return false; }
  lastSavedSignature = sig;
  if (typeof window.__driveNotifySave === 'function') window.__driveNotifySave();
  return true;
}

function getActiveVehicle() {
  if (!state.activeVehicleId) return null;
  return findById(state.vehicles, state.activeVehicleId);
}
function nextColor() {
  var used = state.vehicles.map(function (v) { return v.color; });
  for (var i = 0; i < COLORS.length; i++) if (used.indexOf(COLORS[i]) === -1) return COLORS[i];
  return COLORS[state.vehicles.length % COLORS.length];
}
function sortedReadings(v) {
  return v.readings.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
}
function latestReading(v) {
  var rs = sortedReadings(v);
  return rs.length ? rs[rs.length - 1] : null;
}

/* =====================================================================
   4. CALCULS
   ===================================================================== */
/* ---------- Statistiques mensuelles (interpolation linéaire entre relevés) ---------- */
function computeMonthlyStats(v) {
  var rs = sortedReadings(v);
  if (rs.length < 2) return null;
  var pts = rs.map(function (r) { return { d: parseISO(r.date), km: r.km }; });
  function interp(atDate) {
    if (atDate <= pts[0].d) return pts[0].km;
    if (atDate >= pts[pts.length - 1].d) return pts[pts.length - 1].km;
    for (var i = 0; i < pts.length - 1; i++) {
      if (atDate >= pts[i].d && atDate <= pts[i + 1].d) {
        var t0 = pts[i].d.getTime(), t1 = pts[i + 1].d.getTime();
        var frac = t1 === t0 ? 0 : (atDate.getTime() - t0) / (t1 - t0);
        return pts[i].km + frac * (pts[i + 1].km - pts[i].km);
      }
    }
    return pts[pts.length - 1].km;
  }
  var start = pts[0].d, end = pts[pts.length - 1].d;
  var boundaries = [start];
  var cur = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  while (cur < end) {
    boundaries.push(new Date(cur.getTime()));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  boundaries.push(end);
  var values = [];
  var labels = [];
  for (var i = 1; i < boundaries.length; i++) {
    var v0 = interp(boundaries[i - 1]), v1 = interp(boundaries[i]);
    var spanDays = daysBetween(boundaries[i - 1], boundaries[i]);
    if (spanDays <= 0) continue;
    var normalized = (v1 - v0) / spanDays * DAYS_PER_MONTH;
    values.push(normalized);
    labels.push(boundaries[i].getFullYear() + '-' + pad2(boundaries[i].getMonth() + 1));
  }
  if (!values.length) return null;
  var sum = values.reduce(function (a, b) { return a + b; }, 0);
  var avg = sum / values.length;
  var min = Math.min.apply(null, values);
  var max = Math.max.apply(null, values);
  var totalKm = pts[pts.length - 1].km - pts[0].km;
  var totalMonths = monthsBetweenDec(start, end);
  return {
    avgPerMonth: avg, minPerMonth: min, maxPerMonth: max,
    totalKm: totalKm, totalMonths: totalMonths,
    globalAvgPerMonth: totalMonths > 0 ? totalKm / totalMonths : null,
    monthlySeries: values, monthlyLabels: labels
  };
}

/* ---------- Projection théorique ---------- */
function getTheoryStart(v) {
  var rs = sortedReadings(v);
  if (v.theoreticalStartDate && v.theoreticalStartKm !== null) {
    return { date: parseISO(v.theoreticalStartDate), km: v.theoreticalStartKm };
  }
  if (rs.length) return { date: parseISO(rs[0].date), km: rs[0].km };
  return null;
}
function theoryValueAt(v, atDate) {
  var startInfo = getTheoryStart(v);
  if (!startInfo) return null;
  var months = monthsBetweenDec(startInfo.date, atDate);
  return startInfo.km + Math.max(0, months) * (v.theoreticalKmPerMonth || 0);
}

/* ---------- Statut d'un entretien (inchangé depuis la v1) ----------
   overdue : date atteinte ou kilométrage atteint ; soon : ≤ 30 jours ou ≤ 500 km ;
   ok : à venir ; done : ponctuel déjà réalisé ; none : aucune cible. */
function maintenanceStatus(item, v) {
  if (!item.recurring && item.history && item.history.length > 0) return 'done';
  var lastKm = null; var lr = latestReading(v); if (lr) lastKm = lr.km;
  var today = new Date();
  var hasTrigger = !!item.targetDate || item.targetKm !== null;
  if (!hasTrigger) return 'none';
  var dateOverdue = item.targetDate && parseISO(item.targetDate) <= today;
  var kmOverdue = item.targetKm !== null && lastKm !== null && lastKm >= item.targetKm;
  if (dateOverdue || kmOverdue) return 'overdue';
  var dateSoon = item.targetDate && daysBetween(today, parseISO(item.targetDate)) <= 30;
  var kmSoon = item.targetKm !== null && lastKm !== null && (item.targetKm - lastKm) <= 500;
  if (dateSoon || kmSoon) return 'soon';
  return 'ok';
}
function statusBadge(status) {
  var map = {
    overdue: { cls: 'badge-overdue', label: '⚠ Dépassé' },
    soon: { cls: 'badge-soon', label: '⏳ Bientôt' },
    ok: { cls: 'badge-ok', label: '✓ À jour' },
    done: { cls: 'badge-done', label: '✓ Terminé' },
    none: { cls: 'badge-done', label: '— Non planifié' }
  };
  var m = map[status] || map.none;
  return '<span class="badge ' + m.cls + '">' + m.label + '</span>';
}

/* ---------- Échéance estimée (nouveau en v2) ----------
   Rythme utilisé pour convertir un kilométrage cible en date : moyenne
   mensuelle réelle (≥ 2 relevés), à défaut le km théorique / mois. */
function projectionRate(v) {
  var stats = computeMonthlyStats(v);
  if (stats && stats.avgPerMonth > 0) return { rate: stats.avgPerMonth, source: 'réel' };
  if (v.theoreticalKmPerMonth > 0) return { rate: v.theoreticalKmPerMonth, source: 'théorique' };
  return null;
}
/* Renvoie, pour un entretien : jours restants avant la date cible, km restants
   avant le kilométrage cible, date estimée d'atteinte de ce kilométrage, et
   l'échéance retenue (la plus proche des deux dates). */
function maintenanceDue(m, v, proj) {
  var lr = latestReading(v);
  var res = { daysLeft: null, kmLeft: null, kmDate: null, effective: null, noReading: false };
  var candidates = [];
  if (m.targetDate) {
    var d = parseISO(m.targetDate);
    res.daysLeft = daysBetween(startOfToday(), d);
    candidates.push(d);
  }
  if (m.targetKm !== null) {
    if (!lr) res.noReading = true;
    else {
      res.kmLeft = m.targetKm - lr.km;
      if (proj && proj.rate > 0) {
        res.kmDate = new Date(parseISO(lr.date).getTime() + res.kmLeft / proj.rate * DAYS_PER_MONTH * 86400000);
        candidates.push(res.kmDate);
      }
    }
  }
  candidates.forEach(function (c) { if (!res.effective || c < res.effective) res.effective = c; });
  return res;
}
/* Liste du tableau de bord : tous les entretiens dépassés ou proches, complétés
   par les suivants jusqu'à NEXT_MAINT_COUNT. Ordre : dépassés, proches, à venir,
   puis échéance la plus proche ; sans échéance calculable → en dernier. */
function upcomingMaintenances(v, minCount, proj) {
  var rank = { overdue: 0, soon: 1, ok: 2 };
  var items = [];
  v.maintenances.forEach(function (m) {
    var st = maintenanceStatus(m, v);
    if (rank[st] === undefined) return; // terminés et non planifiés exclus
    items.push({ m: m, status: st, due: maintenanceDue(m, v, proj) });
  });
  items.sort(function (a, b) {
    if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    var ea = a.due.effective, eb = b.due.effective;
    if (ea && eb && ea.getTime() !== eb.getTime()) return ea - eb;
    if (ea && !eb) return -1;
    if (!ea && eb) return 1;
    var ka = a.due.kmLeft, kb = b.due.kmLeft;
    if (ka !== null && kb !== null && ka !== kb) return ka - kb;
    if (ka !== null && kb === null) return -1;
    if (ka === null && kb !== null) return 1;
    return (a.m.label || '').localeCompare(b.m.label || '');
  });
  var alerts = items.filter(function (it) { return it.status !== 'ok'; }).length;
  return { items: items.slice(0, Math.max(minCount, alerts)), total: items.length, alerts: alerts };
}
function dateDueText(due) {
  if (due.daysLeft === null) return '';
  if (due.daysLeft < 0) return 'dépassé de ' + formatNum(-due.daysLeft) + ' j';
  if (due.daysLeft === 0) return 'aujourd\'hui';
  return 'dans ' + formatNum(due.daysLeft) + ' j';
}
function kmDueText(due) {
  if (due.noReading) return 'aucun relevé pour situer le véhicule';
  if (due.kmLeft === null) return '';
  if (due.kmLeft <= 0) return 'dépassé de ' + formatNum(-due.kmLeft) + ' km';
  var txt = 'encore ' + formatNum(due.kmLeft) + ' km';
  if (due.kmDate) txt += ' (≈ ' + MONTH_LONG[due.kmDate.getMonth()] + ' ' + due.kmDate.getFullYear() + ')';
  return txt;
}

/* ---------- Photo : redimensionnement canvas (360 px max, JPEG 78 %) → data URL ---------- */
function readAndResizeImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var maxW = 360;
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.78));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
/* Balise <img> d'une photo de véhicule (null si la photo n'est pas une data URL d'image valide). */
function photoImg(photo, cls) {

/* ---------- Blocs réutilisés par le tableau de bord et l'impression ---------- */

function kpisHtml(v) {

/* Bloc « Prochains entretiens » : liste + note sur le rythme utilisé pour l'estimation.
   minCount : NEXT_MAINT_COUNT au tableau de bord ; Infinity à l'impression (tous les entretiens à venir). */
function upcomingHtml(v, minCount) {

    return '<div class="empty-inline">Aucun entretien à venir pour ce véhicule (aucun planifié, ou tous terminés).</div>';
  }
  var html = '';
  up.items.forEach(function (it) { html += renderMaintCard(it.m, v, false, proj); });
  var notes = [];
  if (up.total > up.items.length) notes.push((up.total - up.items.length) + ' autre(s) entretien(s) planifié(s), visibles dans l\'onglet Entretiens.');
  if (proj) notes.push('Dates estimées des échéances kilométriques au rythme ' + proj.source + ' de ' + formatNum(proj.rate) + ' km/mois.');
  if (notes.length) html += '<p class="next-maint-note">' + escapeHtml(notes.join(' ')) + '</p>';
  return html;
}

/* ---------- Graphique SVG : réel vs théorique (couleurs via variables CSS) ---------- */
function buildKmChart(v, rs) {
  var width = 900, height = 340;
  var padLeft = 62, padRight = 20, padTop = 20, padBottom = 34;
  var plotW = width - padLeft - padRight;
  var plotH = height - padTop - padBottom;
  var color = safeColor(v.color) || COLORS[0];

  var firstDate = parseISO(rs[0].date);
  var lastReadingDate = parseISO(rs[rs.length - 1].date);
  var today = new Date();
  var chartEnd = lastReadingDate > today ? lastReadingDate : today;
  var startInfo = getTheoryStart(v);
  var chartStart = firstDate;
  if (startInfo && startInfo.date < chartStart) chartStart = startInfo.date;

  var totalSpan = chartEnd.getTime() - chartStart.getTime();
  if (totalSpan <= 0) totalSpan = 1;

  var theoryEndVal = theoryValueAt(v, chartEnd);
  var allVals = rs.map(function (r) { return r.km; });
  if (theoryEndVal !== null) allVals.push(theoryEndVal);
  if (startInfo) allVals.push(startInfo.km);
  var minV = Math.min.apply(null, allVals.concat([0]));
  var maxV = Math.max.apply(null, allVals);
  var range = maxV - minV; if (range === 0) range = 1;
  minV = Math.max(0, minV - range * 0.08);
  maxV = maxV + range * 0.08;
  range = maxV - minV;

  function xFor(d) { return padLeft + ((d.getTime() - chartStart.getTime()) / totalSpan) * plotW; }
  function yFor(km) { return padTop + plotH - ((km - minV) / range) * plotH; }

  var svg = [];
  svg.push('<svg class="chart-svg" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Kilométrage réel et théorique">');

  var steps = 5;
  for (var g = 0; g <= steps; g++) {
    var val = minV + (range * g / steps);
    var y = yFor(val);
    svg.push('<line x1="' + padLeft + '" y1="' + y.toFixed(1) + '" x2="' + (padLeft + plotW) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>');
    svg.push('<text x="' + (padLeft - 8) + '" y="' + (y + 4).toFixed(1) + '" font-size="11" fill="var(--ink-muted)" text-anchor="end">' + formatNum(val) + '</text>');
  }

  // graduations mensuelles de l'axe X (8 libellés maximum)
  var tickCur = new Date(chartStart.getFullYear(), chartStart.getMonth(), 1);
  var tickCount = 0;
  while (tickCur <= chartEnd && tickCount < 40) {
    if (tickCur >= chartStart) {
      var xt = xFor(tickCur);
      svg.push('<text x="' + xt.toFixed(1) + '" y="' + (height - padBottom + 18) + '" font-size="10.5" fill="var(--ink-muted)" text-anchor="middle">' + MONTH_NAMES[tickCur.getMonth()] + ' ' + String(tickCur.getFullYear()).slice(2) + '</text>');
    }
    tickCur = new Date(tickCur.getFullYear(), tickCur.getMonth() + (Math.ceil((monthsBetweenDec(chartStart, chartEnd) || 1) / 8) || 1), 1);
    tickCount++;
  }

  // droite théorique (pointillés)
  if (startInfo) {
    var tsx = xFor(startInfo.date < chartStart ? chartStart : startInfo.date);
    var tsKm = theoryValueAt(v, startInfo.date < chartStart ? chartStart : startInfo.date);
    var tex = xFor(chartEnd);
    var teKm = theoryValueAt(v, chartEnd);
    svg.push('<line x1="' + tsx.toFixed(1) + '" y1="' + yFor(tsKm).toFixed(1) + '" x2="' + tex.toFixed(1) + '" y2="' + yFor(teKm).toFixed(1) + '" stroke="var(--ink-muted)" stroke-width="2.5" stroke-dasharray="7,5" stroke-linecap="round"/>');
  }

  // courbe réelle (couleur du véhicule, contrôlée)
  var pts = rs.map(function (r) { return xFor(parseISO(r.date)).toFixed(1) + ',' + yFor(r.km).toFixed(1); });
  svg.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>');
  rs.forEach(function (r) {
    var cx = xFor(parseISO(r.date)).toFixed(1), cy = yFor(r.km).toFixed(1);
    svg.push('<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="1.5"><title>' + formatDateFR(r.date) + ' — ' + formatNum(r.km) + ' km</title></circle>');
  });

  svg.push('</svg>');

  var legend = '<div class="chart-legend">' +
    '<span class="legend-item"><span class="legend-swatch" style="background:' + color + '"></span>Kilométrage réel</span>' +
    (startInfo ? '<span class="legend-item"><span class="legend-swatch dashed"></span>Théorique (' + formatNum(v.theoreticalKmPerMonth) + ' km/mois)</span>' : '') +
    '</div>';

  var gapHtml = '';
  if (startInfo && rs.length) {
    var lastR = rs[rs.length - 1];
    var theoryAtLast = theoryValueAt(v, parseISO(lastR.date));
    var gap = lastR.km - theoryAtLast;
    var isPos = gap <= 0;
    gapHtml = '<div class="gap-banner ' + (isPos ? 'pos' : 'neg') + '">' +
      (isPos ? '✓ ' : '⚠ ') +
      (isPos ? 'En retrait de ' + formatNum(Math.abs(gap)) + ' km par rapport à la théorie (à la date du dernier relevé)' :
               'En avance de ' + formatNum(Math.abs(gap)) + ' km par rapport à la théorie (à la date du dernier relevé)') +
      '</div>';
  }

  return '<div class="chart-block">' + svg.join('') + legend + '</div>' + gapHtml;
}

function renderMaintCard(m, v, showFull, proj) {
  var status = maintenanceStatus(m, v);
  var cat = catById(m.category);
  var cls = (status === 'overdue' || status === 'soon' || status === 'ok') ? status : '';
  var due = (status === 'done' || status === 'none') ? null : maintenanceDue(m, v, proj);
  var id = escapeHtml(m.id);
  var html = '<div class="maint-card ' + cls + '">';
  html += '<div class="maint-top">';
  html += '<div class="maint-title"><span class="maint-cat-icon">' + cat.icon + '</span>' + escapeHtml(m.label || cat.label) + '</div>';
  html += statusBadge(status);
  html += '</div>';
  html += '<div class="maint-sub">' + escapeHtml(v.name) + ' · ' + escapeHtml(cat.label) + (m.recurring ? ' · 🔁 récurrent' : '') + '</div>';
  if (m.targetDate || m.targetKm !== null) {
    var dueCls = status === 'overdue' ? ' overdue' : (status === 'soon' ? ' soon' : '');
    html += '<div class="maint-meta">';
    if (m.targetDate) {
      var dt = due ? dateDueText(due) : '';
      html += '<span>📅 Prévu le <b>' + formatDateFR(m.targetDate) + '</b>' + (dt ? ' · <span class="maint-due' + (due.daysLeft <= 30 ? dueCls : '') + '">' + escapeHtml(dt) + '</span>' : '') + '</span>';
    }
    if (m.targetKm !== null) {
      var kt = due ? kmDueText(due) : '';
      html += '<span>🛣️ Prévu à <b>' + formatNum(m.targetKm) + ' km</b>' + (kt ? ' · <span class="maint-due' + (due.kmLeft !== null && due.kmLeft <= 500 ? dueCls : '') + '">' + escapeHtml(kt) + '</span>' : '') + '</span>';
    }
    html += '</div>';
  }
  if (m.notes) html += '<p class="maint-notes">' + escapeHtml(m.notes) + '</p>';
  if (status !== 'done') {
    html += '<div class="maint-actions"><button class="btn-tiny ok" data-validate-mt="' + id + '">✓ Valider comme fait</button>';
    if (showFull) html += '<button class="btn-tiny" data-edit-mt="' + id + '">✏️ Modifier</button><button class="btn-tiny danger" data-del-mt="' + id + '">🗑️ Supprimer</button>';

  html += '</div>';

/* =====================================================================
   7. IMPORT / EXPORT JSON
   Format commun (export, copie locale) :
     { app:'kmtrack', version:1, exportedAt:ISO8601, state:{…} }
   L'import accepte aussi les exports de la v1 (état brut avec « vehicles »).
   ===================================================================== */
function exportPayload() {
  return { app: APP_NS, version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), state: JSON.parse(JSON.stringify(state)) };
}
function stampDate(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function stampTime(d) { return pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()); }
function downloadText(text, filename, mime) {
  var blob = new Blob([text], { type: mime || 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function exportJSON() {
  downloadText(JSON.stringify(exportPayload(), null, 2), stampDate(new Date()) + '_SuiviKilometrique.json');
  showToast('Export téléchargé (' + state.vehicles.length + ' véhicule(s))', 'success');
}
/* Lit le contenu d'un fichier et renvoie { state } ou { error }. */
function parseImportFile(text) {
  var data;
  try { data = JSON.parse(text); } catch (e) { return { error: 'Fichier JSON illisible.' }; }
  if (!data || typeof data !== 'object') return { error: 'Fichier JSON invalide.' };
  if (data.app !== undefined) {
    if (data.app !== APP_NS) return { error: 'Ce fichier provient d\'un autre outil (« ' + str(data.app) + ' ») : import refusé.' };
    if (typeof data.version === 'number' && data.version > SCHEMA_VERSION) return { error: 'Ce fichier a été créé par une version plus récente de l\'outil (format ' + data.version + ') : mettez l\'outil à jour.' };
    if (!data.state || !Array.isArray(data.state.vehicles)) return { error: 'Fichier invalide : données « vehicles » manquantes.' };
    return { state: migrateState(data.state) };
  }
  // ancien format (export v1) : état brut
  if (!Array.isArray(data.vehicles)) return { error: 'Fichier JSON invalide : propriété « vehicles » manquante.' };
  return { state: migrateState(data) };
}
/* Rapprochement d'un véhicule importé : même identifiant, sinon même nom (sans casse). */
function findMatchingVehicle(iv) {
  var byId = findById(state.vehicles, iv.id);
  if (byId) return byId;
  var n = iv.name.trim().toLowerCase();
  for (var i = 0; i < state.vehicles.length; i++) if (state.vehicles[i].name.trim().toLowerCase() === n) return state.vehicles[i];
  return null;
}
function openImportModal(incoming, fileName) {
  var added = [], matched = [];
  incoming.vehicles.forEach(function (iv) { (findMatchingVehicle(iv) ? matched : added).push(iv); });
  var li = function (list) { return list.map(function (v) { return '<li>' + escapeHtml(v.name) + (v.plate ? ' — ' + escapeHtml(v.plate) : '') + '</li>'; }).join(''); };
  var body = '<div class="modal-hint">Fichier « ' + escapeHtml(fileName) + ' » : ' + incoming.vehicles.length + ' véhicule(s).</div>';
  body += '<p class="confirm-message"><b>Fusionner</b> ajoute les véhicules absents et conserve les autres données de l\'outil.</p>';
  if (added.length) body += '<p class="confirm-message" style="margin-top:8px;">Nouveaux véhicules :</p><ul class="import-list">' + li(added) + '</ul>';
  if (matched.length) {
    body += '<p class="confirm-message" style="margin-top:8px;">Déjà présents (même identifiant ou même nom) :</p><ul class="import-list">' + li(matched) + '</ul>';
    body += '<label class="check-label"><input type="checkbox" id="imp-replace-existing"> Remplacer ces véhicules par la version du fichier (sinon ils sont ignorés)</label>';
  }
  body += '<p class="confirm-message" style="margin-top:4px;"><b>Tout remplacer</b> efface toutes les données actuelles (ici et sur Drive après synchro) et charge celles du fichier.</p>';
  body += '<div class="modal-footer"><button class="btn-secondary" id="imp-cancel">Annuler</button><button class="btn-danger" id="imp-replace-all">Tout remplacer</button><button class="btn-primary" id="imp-merge">Fusionner</button></div>';
  openModal('Importer des données', body, function () {
    $('imp-cancel').addEventListener('click', closeModal);
    $('imp-merge').addEventListener('click', function () {
      var replaceExisting = !!($('imp-replace-existing') && $('imp-replace-existing').checked);
      closeModal();
      applyImportMerge(incoming, replaceExisting);
    });
    $('imp-replace-all').addEventListener('click', function () {
      closeModal();
      state = incoming;
      saveState();
      renderAll();
      showToast('Données remplacées — ' + state.vehicles.length + ' véhicule(s) chargé(s)', 'success');
    });
  });
}
/* Fusion véhicule par véhicule : nouveaux ajoutés ; existants remplacés
   (en gardant leur identifiant) seulement si demandé, sinon ignorés. */
function applyImportMerge(incoming, replaceExisting) {
  var added = 0, replaced = 0, ignored = 0;
  incoming.vehicles.forEach(function (iv) {
    var ex = findMatchingVehicle(iv);
    if (!ex) {
      if (findById(state.vehicles, iv.id)) iv.id = uid('veh');
      state.vehicles.push(iv);
      added++;
    } else if (replaceExisting) {
      iv.id = ex.id;
      state.vehicles[state.vehicles.indexOf(ex)] = iv;
      replaced++;
    } else {
      ignored++;
    }
  });
  if (!state.activeVehicleId && state.vehicles.length) state.activeVehicleId = state.vehicles[0].id;
  saveState();
  renderAll();
  showToast(added + ' ajouté(s), ' + replaced + ' remplacé(s), ' + ignored + ' ignoré(s)', 'success');
}
function importJSON(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    var res = parseImportFile(e.target.result);
    if (res.error) showToast(res.error, 'error');
    else openImportModal(res.state, file.name);
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* =====================================================================
   8. COPIE LOCALE (historique horodaté dans un dossier)
   - API File System Access (Chrome / Edge) : dossier choisi une fois,
     mémorisé dans IndexedDB ; seule l'autorisation est redemandée ensuite.
     Maj + clic sur le bouton : choisir un autre dossier.
   - Écrit Suivi_Km_copie_AAAAMMJJ_HHMMSS.json + Suivi_Km_trame_vN.html
     (trame vierge de l'outil, une seule fois par version).
   - Sans l'API (ex. Firefox) : la copie est téléchargée.
   La copie ne remplace pas la synchro Drive : c'est une archive.
   ===================================================================== */
var FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';
var PICKER_ID = 'suiviKm';
var HANDLE_DB = 'kmtrack_fs';
var HANDLE_STORE = 'handles';
var HANDLE_KEY = 'copyDir';
var copyDirHandle = null;

function fsIdbOpen() {
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) { reject(new Error('IndexedDB indisponible')); return; }
    var req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore(HANDLE_STORE); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function fsIdbGetHandle() {
  return fsIdbOpen().then(function (db) {
    return new Promise(function (resolve) {
      var r = db.transaction(HANDLE_STORE, 'readonly').objectStore(HANDLE_STORE).get(HANDLE_KEY);
      r.onsuccess = function () { db.close(); resolve(r.result || null); };
      r.onerror = function () { db.close(); resolve(null); };
    });
  }).catch(function () { return null; });
}
function fsIdbSetHandle(handle) {
  return fsIdbOpen().then(function (db) {
    return new Promise(function (resolve) {
      var tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror = function () { db.close(); resolve(); };
    });
  }).catch(function () {});
}
function ensurePermission(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') return Promise.resolve(!!handle);
  var opts = { mode: 'readwrite' };
  return handle.queryPermission(opts).then(function (p) {
    if (p === 'granted') return true;
    return handle.requestPermission(opts).then(function (p2) { return p2 === 'granted'; });
  }).catch(function () { return false; });
}
function pickCopyDir() {
  return window.showDirectoryPicker({ id: PICKER_ID, mode: 'readwrite' }).then(function (h) {
    copyDirHandle = h;
    fsIdbSetHandle(h);
    return h;
  });
}
/* Dossier utilisable : celui de la session, sinon celui mémorisé (après autorisation), sinon choix. */
function getCopyDir(forcePick) {
  if (forcePick) return pickCopyDir();
  if (copyDirHandle) return ensurePermission(copyDirHandle).then(function (ok) { return ok ? copyDirHandle : pickCopyDir(); });
  return fsIdbGetHandle().then(function (stored) {
    if (!stored) return pickCopyDir();
    return ensurePermission(stored).then(function (ok) {
      if (!ok) return pickCopyDir();
      copyDirHandle = stored;
      return stored;
    });
  });
}
function localCopyFileName() { var d = new Date(); return FILE_PREFIX + '_copie_' + stampDate(d) + '_' + stampTime(d) + '.json'; }
function templateFileName() { return FILE_PREFIX + '_trame_' + TOOL_VERSION + '.html'; }
function writeFileInDir(dirHandle, filename, content) {
  return dirHandle.getFileHandle(filename, { create: true }).then(function (fh) {
    return fh.createWritable().then(function (w) { return w.write(content).then(function () { return w.close(); }); });
  });
}
function writeTemplateIfNeeded(dirHandle) {
  if (!pristineHtmlTemplate) return Promise.resolve();
  var name = templateFileName();
  return dirHandle.getFileHandle(name, { create: false }).then(function () {}, function () {
    return writeFileInDir(dirHandle, name, pristineHtmlTemplate);
  }).catch(function () { /* la trame est un bonus : son échec ne fait pas échouer la copie */ });
}
var localCopyInProgress = false;
function localCopy(forcePick) {
  if (localCopyInProgress) return;
  var filename = localCopyFileName();
  var json = function () { return JSON.stringify(exportPayload(), null, 2); };
  if (!FS_SUPPORTED) {
    downloadText(json(), filename);
    showToast('Copie locale téléchargée (' + filename + ').', 'success');
    return;
  }
  localCopyInProgress = true;
  getCopyDir(forcePick).then(function (dir) {
    return writeFileInDir(dir, filename, json()).then(function () { return writeTemplateIfNeeded(dir); }).then(function () {
      showToast('Copie locale enregistrée dans « ' + dir.name + ' » (' + filename + ').', 'success');
    });
  }).then(function () { localCopyInProgress = false; }).catch(function (err) {
    localCopyInProgress = false;
    if (err && err.name === 'AbortError') return; // choix du dossier annulé
    copyDirHandle = null;
    downloadText(json(), filename);
    showToast('Écriture dans le dossier impossible : la copie a été téléchargée.', 'warning');
  });
}

/* =====================================================================
   9. IMPRESSION PDF
   Remplit #printArea (seule zone visible à l'impression), force le thème
   clair pendant l'impression puis restaure le thème du poste.

function printVehicleHtml(v, printedAt) {

    escapeHtml([[v.brand, v.model].filter(Boolean).join(' '), v.plate, v.fuelType].filter(Boolean).join(' · ')) +
    (v.firstRegistration ? ' · 1ère immat. ' + formatDateFR(v.firstRegistration) : '') + ' — Imprimé le ' + escapeHtml(printedAt) + '</p></div>';
  html += kpisHtml(v);
  html += '<div class="card"><div class="card-header"><div><h3>📈 Kilométrage réel vs théorique</h3><p class="card-sub">Théorique : ' + formatNum(v.theoreticalKmPerMonth) + ' km/mois' +
    (v.theoreticalStartDate && v.theoreticalStartKm !== null ? ', départ le ' + formatDateFR(v.theoreticalStartDate) + ' à ' + formatNum(v.theoreticalStartKm) + ' km' : ', départ au premier relevé') + '</p></div></div>';
  html += rs.length < 2 ? '<p class="card-sub">Moins de 2 relevés : pas de graphique.</p>' : buildKmChart(v, rs);
  html += '</div>';
  // à l'impression : TOUS les entretiens à venir (dans le même ordre qu'au tableau de bord)
  html += '<div class="card"><div class="card-header"><h3>🔧 Entretiens à venir</h3></div>' + upcomingHtml(v, Infinity) + '</div>';
  var others = v.maintenances.filter(function (m) { var s = maintenanceStatus(m, v); return s === 'done' || s === 'none'; });
  if (others.length) {
    html += '<div class="card"><div class="card-header"><h3>🗂️ Entretiens terminés ou non planifiés (' + others.length + ')</h3></div>';
    others.forEach(function (m) { html += renderMaintCard(m, v, false, proj); });
    html += '</div>';
  }
  html += '<div class="card"><div class="card-header"><h3>📋 Relevés kilométriques (' + rs.length + ')</h3></div>' +
    (rs.length ? readingsTableHtml(v, false) : '<p class="card-sub">Aucun relevé.</p>') + '</div>';
  html += '</section>';
  return html;
}
function doPrint(vehicles) {
  var now = new Date();
  var printedAt = now.toLocaleDateString('fr-FR') + ' à ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  $('printArea').innerHTML = vehicles.map(function (v) { return printVehicleHtml(v, printedAt); }).join('');
  var previousTheme = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', 'light');
  var restore = function () {
    document.documentElement.setAttribute('data-theme', previousTheme || 'light');
    $('printArea').innerHTML = '';
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  window.print();
}
function printFlow() {
  var v = getActiveVehicle();
  if (!v) { showToast('Ajoutez un véhicule avant d\'imprimer.', 'warning'); return; }
  if (state.vehicles.length === 1) { doPrint([v]); return; }
  var body = '<label class="radio-line"><input type="radio" name="print-scope" value="active" checked> Véhicule actif : ' + escapeHtml(v.name) + '</label>' +
    '<label class="radio-line"><input type="radio" name="print-scope" value="all"> Tous les véhicules (' + state.vehicles.length + ', un par page)</label>' +
    '<div class="modal-footer"><button class="btn-secondary" id="pr-cancel">Annuler</button><button class="btn-primary" id="pr-go">🖨️ Imprimer</button></div>';
  openModal('Imprimer / PDF', body, function () {
    $('pr-cancel').addEventListener('click', closeModal);
    $('pr-go').addEventListener('click', function () {
      var all = document.querySelector('input[name="print-scope"]:checked').value === 'all';
      closeModal();
      doPrint(all ? state.vehicles.slice() : [v]);
    });
  }, 'modal-small');
}

    var btns = document.querySelectorAll('[data-guide-goto]');
    for (var i = 0; i < btns.length; i++) (function (b) {
      b.addEventListener('click', function () { var t = $(b.getAttribute('data-guide-goto')); if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });

/* =====================================================================
   11. THÈME ET INITIALISATION
   ===================================================================== */
function readThemePref() { try { return localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } }
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
  var btn = $('themeToggleBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
}

function init() {
  state = loadState();
  lastSavedSignature = stateSignature(state);
  applyTheme(readThemePref());

  $('btnExport').addEventListener('click', exportJSON);
  $('btnImport').addEventListener('click', function () { $('importInput').click(); });
  $('importInput').addEventListener('change', importJSON);
  $('btnLocalCopy').addEventListener('click', function (e) { localCopy(!!e.shiftKey && FS_SUPPORTED); });
  $('btnPrintPdf').addEventListener('click', printFlow);
  $('btnGuide').addEventListener('click', openGuide);
  $('btnBlank').addEventListener('click', function () {
    requestConfirm('Créer une trame vierge ? Toutes les données actuelles seront effacées, y compris sur Drive si la synchro est active. Faites d\'abord un export ou une copie locale pour en garder une trace.', function () {
      state = blankState();
      saveState();
      showToast('Trame vierge créée', 'success');
      renderAll();
    }, { title: 'Trame vierge', okLabel: 'Tout effacer', danger: true });
  });
  $('themeToggleBtn').addEventListener('click', toggleTheme);
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) (function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  })(tabs[i]);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (isConfirmOpen()) resolveConfirm(false);
      else if (isModalOpen()) closeModal();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      localCopy(false);
    }
  });

  renderAll();
}

init();
})();
</script>
